<style>
/* ===== 7. STYLING / UI ===== */
:root{--bg:#0e1030;--pan:rgba(22,24,64,.95);--line:#3b3f8c;--teal:#2dd4bf;--txt:#e8eafc;--mut:#9aa0d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 system-ui,'Segoe UI',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{grid-area:h;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#15174a}
header b{color:var(--teal);letter-spacing:.5px}header span{color:var(--mut)}
aside{background:var(--pan);overflow:auto;padding:12px}
#left{grid-area:l;border-right:1px solid var(--line)}#right{grid-area:r;border-left:1px solid var(--line)}
h3{margin:12px 0 6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}h3:first-child{margin-top:0}
button{font:inherit;color:var(--txt);background:#1c2058;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--teal);background:#2a2f78}button.on{background:#0f766e;border-color:var(--teal)}
.mode,.comp{display:block;width:100%;text-align:left;margin-bottom:4px}.comp{font-size:12px;padding:4px 8px}
#view{grid-area:v;position:relative;min-width:0;background:radial-gradient(circle at 50% 35%,#3a2f8f,#12143a)}
#view canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(8px,-50%);font-size:11px;padding:2px 7px;background:rgba(16,18,56,.9);border:1px solid var(--teal);border-radius:10px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl:before{content:"";position:absolute;left:-9px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--teal)}
#tip{position:absolute;display:none;max-width:240px;padding:6px 9px;background:rgba(14,16,48,.96);border:1px solid var(--teal);border-radius:6px;font-size:12px;pointer-events:none}
#cap{position:absolute;left:12px;right:12px;bottom:10px;padding:8px 12px;background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:6px;transition:.3s}
#cap b{color:var(--teal)}
#info h2{margin:0 0 4px;font-size:16px;color:var(--teal)}#info h4{margin:10px 0 2px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}#info p{margin:0}
footer{grid-area:f;border-top:1px solid var(--line);background:#15174a;padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#pipe{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{padding:3px 9px;border:1px solid var(--line);border-radius:12px;font-size:11px;color:var(--mut);transition:.4s}
.chip.done{color:var(--txt);border-color:#2a8a86}.chip.act{background:#0f766e;color:#fff;border-color:var(--teal);box-shadow:0 0 10px #2dd4bf88}
.arr{color:var(--line)}#btns{display:flex;gap:6px;flex-wrap:wrap}
#wm{position:absolute;right:14px;bottom:10px;z-index:9;pointer-events:none;user-select:none;font:italic 600 13px/1 system-ui,'Segoe UI',sans-serif;letter-spacing:.5px;color:#fff;opacity:.45;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#cal{position:absolute;inset:10px;display:none;overflow:auto;background:rgba(14,16,48,.98);border:1px solid var(--teal);border-radius:10px;padding:14px;z-index:5}#cal.show{display:block}
.cg{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.3fr);gap:16px;margin-top:8px}@media(max-width:900px){.cg{grid-template-columns:1fr}}
#cal h4{margin:10px 0 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
#cal label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}#cal label.ck{justify-content:flex-start}
#cal input{background:#171a52;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:110px;font:inherit}#cal table input{width:80px}#cal label.ck input{width:auto}#cal td{padding:2px 4px}#cr p{margin:6px 0}

*{-webkit-tap-highlight-color:transparent}
header{flex:none;height:48px;box-sizing:border-box;gap:10px;padding:0 10px}
header .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{flex:none;width:38px;height:36px;padding:0;font-size:18px;line-height:1;text-align:center}
#iBtn{margin-left:auto}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;--dw:210px;--rw:330px}
#left,#right{position:absolute;top:0;bottom:0;z-index:4;box-sizing:border-box;transition:transform .32s cubic-bezier(.4,0,.2,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#left{left:0;width:var(--dw);transform:translateX(-100%);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.35)}
#stage.menu #left{transform:none}
#right{right:0;width:var(--rw)}
#stage.noinfo #right{transform:translateX(100%)}
#view{position:absolute;top:0;bottom:0;left:0;right:var(--rw);transition:left .32s cubic-bezier(.4,0,.2,1),right .32s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.4,0,.2,1)}
#stage.menu #view{left:var(--dw)}
#stage.noinfo #view{right:0}
#view canvas{touch-action:none}
#iX{display:none;float:right}
footer{flex:none}
@media(max-width:900px){
#stage{--dw:min(72vw,250px)}
#view,#stage.menu #view,#stage.noinfo #view{left:0;right:0}
#stage.menu #view{transform:translateX(var(--dw))}
#right{left:0;right:auto;top:auto;width:100%;max-height:50%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%);box-shadow:0 -4px 24px rgba(0,0,0,.35)}
#stage.noinfo #right{transform:translateY(100%)}
#stage.info #right{transform:none}
#iX{display:inline-block}
header .sub{display:none}
footer{flex-direction:column;align-items:stretch;gap:6px;padding:6px 8px}
#pipe,#btns{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#pipe>*,#btns>*{flex:none;white-space:nowrap}
button{padding:8px 12px}.mode{padding:10px}.comp{padding:9px 10px;font-size:13px}
#cap{left:8px;right:8px;bottom:8px;font-size:12px;max-height:34%;overflow:auto;padding:6px 10px}
#cal{inset:6px;padding:10px}
}

/* caption ringkas di pojok kiri-atas agar tidak menutupi model */
#view #cap{left:10px;right:auto;top:10px;bottom:auto;width:auto;max-width:min(340px,calc(100% - 20px));padding:6px 10px;font-size:12px;line-height:1.35;background:rgba(14,16,48,.88);pointer-events:none}
#view #cap b{display:block;font-size:12px}
/* warna tombol lebih tajam */
button{background:#232a8a;border-color:#7b84ff;color:#fff}
button:hover{background:#3340d6;border-color:var(--teal)}
button.on{background:#0d9488;border-color:#5eead4}
#bSim{background:#15803d;border-color:#4ade80;font-weight:700}
.chip{color:#c9ceff;border-color:#5b62c8}.chip.done{color:#fff;border-color:#2dd4bf}

/* menu bawah dapat digeser kiri-kanan (sentuh/seret/roda mouse) */
footer{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;gap:6px;min-width:0;max-width:100%;overflow:hidden}
#pipe,#btns{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;min-width:0;max-width:100%;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#5b62c8 transparent;padding-bottom:3px}
#pipe>*,#btns>*{flex:none;white-space:nowrap}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}.st div{background:#171a52;border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}.st small{display:block;color:var(--mut);font-size:10px}.st b{font-size:14px;color:var(--teal)}
.rt{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.rt th,.rt td{border:1px solid var(--line);padding:3px 6px;text-align:right}.rt th:first-child,.rt td:first-child{text-align:left}
#ikv{position:absolute;inset:10px;display:none;overflow:auto;background:rgba(14,16,48,.98);border:1px solid var(--teal);border-radius:10px;padding:14px;z-index:6}#ikv.show{display:block}
#ikv .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:820px;margin:0 auto 10px}#ikv .bar h2{margin:0;font-size:16px;color:var(--teal)}
#ikv .paper{max-width:820px;margin:0 auto;background:#fbfaf6;color:#1a1a1a;border-radius:6px;padding:18px 22px 22px;font-size:13.5px;line-height:1.55}
#ikv table.hd{width:100%;border-collapse:collapse;margin-bottom:10px}#ikv table.hd td{border:1.5px solid #222;padding:5px 8px;font-size:12.5px;vertical-align:middle}
#ikv .ttl{text-align:center;font-weight:700;border:1.5px solid #222;padding:6px;margin-bottom:12px;font-size:13px}
#ikv h3{margin:16px 0 6px;font-size:14px;letter-spacing:0;text-transform:none;color:#111}#ikv ol{margin:4px 0 4px 0;padding-left:26px}#ikv li{margin:4px 0}#ikv ol ol{list-style:lower-alpha}#ikv ul{margin:3px 0;padding-left:22px;list-style:circle}
#ikv .ph{display:inline-block;margin:4px 0;padding:2px 8px;border:1px dashed #8a8a8a;border-radius:4px;color:#555;font-size:12px;background:#f0eee6}
#ikv .sg{display:flex;justify-content:space-between;gap:16px;margin-top:22px;font-size:13px}#ikv .sg div{width:48%}
@media(max-width:900px){#ikv{inset:6px;padding:10px}#ikv .paper{padding:12px}#ikv .sg{flex-direction:column}#ikv .sg div{width:100%}}
#cr .fm{color:var(--mut);font-size:12px}#cr .ok{color:#34d399}#cr .bad{color:#f59e0b}

/* mode layar penuh: sembunyikan header, menu kiri, dan panel info kanan; model 3D memenuhi layar */
#fsX{display:none;position:absolute;top:10px;right:10px;z-index:8;width:38px;height:36px;padding:0;font-size:18px;line-height:1}
#app.full header,#app.full #left,#app.full #right{display:none!important}
#app.full #view,#app.full #stage.menu #view,#app.full #stage.noinfo #view{left:0!important;right:0!important;transform:none!important}
#app.full #fsX{display:block}
#app.full #view #cap{left:50%;right:auto;top:auto;bottom:10px;transform:translateX(-50%);text-align:center;max-width:min(560px,calc(100% - 24px))}
</style></head>
<body>
<!-- ===== 1. STRUKTUR APLIKASI ===== -->
<div id="app">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE)document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* Cadangan OrbitControls: dipakai hanya bila pustaka dari CDN gagal dimuat */
if(window.THREE&&!THREE.OrbitControls){THREE.OrbitControls=function(cam,dom){
  const S=this,tg=new THREE.Vector3(),sp=new THREE.Spherical(),off=new THREE.Vector3(),ls={};
  S.object=cam;S.domElement=dom;S.target=tg;S.enableDamping=false;S.dampingFactor=.05;S.enableZoom=true;S.enableRotate=true;S.enablePan=true;
  S.minDistance=0;S.maxDistance=Infinity;S.minPolarAngle=0;S.maxPolarAngle=Math.PI;
  S.addEventListener=(n,f)=>(ls[n]=ls[n]||[]).push(f);const fire=n=>(ls[n]||[]).forEach(f=>f());
  let dS=0,dT=0,pan=new THREE.Vector3(),mode=null,px=0,py=0,pts=new Map(),pd=0;
  dom.style.touchAction='none';
  function doPan(dx,dy){const d=cam.position.distanceTo(tg),h=2*d*Math.tan(cam.fov*Math.PI/360)/dom.clientHeight;
    const x=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),y=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1);
    pan.add(x.multiplyScalar(-dx*h)).add(y.multiplyScalar(dy*h));}
  dom.addEventListener('contextmenu',e=>e.preventDefault());
  dom.addEventListener('pointerdown',e=>{dom.setPointerCapture&&dom.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);px=e.clientX;py=e.clientY;
    mode=(e.button===2||e.shiftKey||e.ctrlKey)?'pan':'rot';if(pts.size===2){mode='two';const a=[...pts.values()];pd=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);}fire('start');});
  dom.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
    if(mode==='two'&&pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
      doPan((e.clientX-px)/2,(e.clientY-py)/2);pd=d;px=e.clientX;py=e.clientY;return;}
    const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    if(mode==='pan'){if(S.enablePan)doPan(dx,dy);}else if(mode==='rot'&&S.enableRotate){dS-=2*Math.PI*dx/dom.clientHeight;dT-=2*Math.PI*dy/dom.clientHeight;}});
  const up=e=>{pts.delete(e.pointerId);if(!pts.size)mode=null;else if(pts.size===1){const r=[...pts.values()][0];px=r.clientX;py=r.clientY;mode='rot';}};
  dom.addEventListener('pointerup',up);dom.addEventListener('pointercancel',up);
  dom.addEventListener('wheel',e=>{if(!S.enableZoom)return;e.preventDefault();const f=Math.pow(.95,-e.deltaY*.01*3);
    off.copy(cam.position).sub(tg);off.multiplyScalar(1/f);const l=Math.min(S.maxDistance,Math.max(S.minDistance,off.length()));off.setLength(l);cam.position.copy(tg).add(off);},{passive:false});
  S.update=function(){off.copy(cam.position).sub(tg);sp.setFromVector3(off);
    const k=S.enableDamping?S.dampingFactor:1;sp.theta+=dS*k;sp.phi+=dT*k;
    sp.phi=Math.max(S.minPolarAngle,Math.min(S.maxPolarAngle,sp.phi));sp.phi=Math.max(1e-6,Math.min(Math.PI-1e-6,sp.phi));
    sp.radius=Math.max(S.minDistance,Math.min(S.maxDistance,sp.radius));
    tg.addScaledVector(pan,k);off.setFromSpherical(sp);cam.position.copy(tg).add(off);cam.lookAt(tg);
    if(S.enableDamping){dS*=1-k;dT*=1-k;pan.multiplyScalar(1-k);}else{dS=dT=0;pan.set(0,0,0);}return true;};
  S.dispose=()=>{};
};}
</script>
<script>
(()=>{
/* ===== 6. DATA PANEL INFORMASI =====
   Format: id:[Nama, Fungsi, Prinsip kerja, Hubungan dengan proses AAS, Contoh masalah, posisi label] */
const D={
lampDoor:["Pintu Kompartemen Lampu HCL","Pintu lampu katoda berfungsi untuk melindungi kompartemen lampu HCL dari debu dan cahaya luar, mencegah operator menyentuh bagian bertegangan tinggi, serta menjadi akses penggantian lampu.","Pintu hanya dibuka saat lampu mati. Lampu yang dipilih diputar ke posisi aktif (turret) atau dicabut dari soketnya (4 pin) untuk diganti, lalu pintu ditutup kembali.","Lampu yang tepat (unsur & arus) menentukan panjang gelombang dan sensitivitas pengukuran.","Salah pasang pin/lampu tidak sejajar → energi rendah; membuka pintu saat lampu menyala berbahaya (tegangan tinggi).",[1.71,1.5,1.6]],
lampComp:["Lamp Compartment","Kompartemen lampu berfungsi untuk menempatkan beberapa lampu HCL, memilih lampu unsur yang digunakan, dan memanaskan lampu berikutnya (warm-up) agar emisinya stabil.","Turret diputar untuk memilih lampu aktif; cermin mengarahkan berkas lampu ke ruang atomisasi.","Menyediakan sumber radiasi garis untuk unsur yang diukur.","Lampu tidak sejajar → energi rendah; ventilasi buruk → baseline drift.",[1.71,0.7,1.5]],
hcl:["Hollow Cathode Lamp (HCL)","HCL berfungsi sebagai sumber radiasi garis sempit yang khas untuk unsur analit (mis. lampu Cu: garis resonansi 324,7 nm), yaitu radiasi yang akan diserap atom analit di flame.","Tegangan tinggi antara anoda dan katoda mengionisasi gas isian (Ne/Ar). Ion positif dipercepat menumbuk katoda berongga sehingga atom logam terlepas (sputtering), lalu atom itu tereksitasi oleh tumbukan dan memancarkan garis emisi sempit khas unsurnya saat kembali ke keadaan dasar.","Panjang gelombang garis ini sama dengan garis serapan atom unsur yang sama di dalam flame, sehingga hanya atom analit yang menyerapnya (selektif); penyerapannya mengikuti Hukum Beer–Lambert.","Umur habis, intensitas turun, noise tinggi; arus lampu salah; salah pasang lampu.",[1.51,0.95,1]],
burner:["Burner Head","Burner berfungsi untuk mengalirkan campuran aerosol sampel, bahan bakar, dan oksidan ke nyala serta membentuk nyala laminar yang stabil dengan jalur optik panjang.","Campuran homogen dari spray chamber keluar melalui slot dengan kecepatan lebih besar daripada kecepatan pembakaran sehingga nyala stabil di atas burner dan tidak merambat balik ke dalam.","Menyediakan jalur optik panjang (b) untuk Hukum Beer–Lambert (slot ±10 cm untuk udara–asetilen, ±5 cm untuk N₂O–asetilen): makin panjang b, makin besar absorbansi.","Slot tersumbat garam/karbon → nyala tidak rata dan sinyal tidak stabil; kecepatan gas terlalu rendah atau drain bermasalah → flashback.",[-0.38,1.75,1]],
flame:["Flame (Zona Atomisasi)","Flame berfungsi sebagai tempat atomisasi, yaitu mengubah analit dalam aerosol menjadi atom bebas keadaan dasar pada suhu ≈2300 °C (udara–C₂H₂).","Aerosol melewati tiga tahap: desolvasi (pelarut menguap, tersisa partikel padat) → vaporisasi (padatan menjadi uap molekul) → atomisasi (molekul terdisosiasi menjadi atom bebas keadaan dasar).","Menghasilkan atom bebas keadaan dasar dengan jumlah sebanding dengan konsentrasi analit; atom inilah yang menyerap radiasi HCL.","Komposisi nyala terlalu kaya/miskin bahan bakar; interferensi kimia (senyawa stabil seperti oksida/fosfat), ionisasi atom, emisi nyala.",[0.15,1.65,1]],
nebulizer:["Nebulizer","Nebulizer berfungsi untuk menghisap larutan sampel dan mengubahnya menjadi aerosol (kabut halus).","Oksidan (udara) mengalir cepat melewati ujung kapiler sehingga tekanan di sana turun (efek Venturi, prinsip Bernoulli); larutan terhisap naik lalu terpecah menjadi tetesan, kemudian ditumbukkan ke impact bead agar tetesan menjadi lebih halus.","Ukuran tetesan dan laju hisap menentukan jumlah analit yang sampai ke flame, sehingga memengaruhi sensitivitas.","Kapiler tersumbat → sinyal turun/tidak stabil; impact bead rusak.",[-0.38,1.25,1.3]],
spray:["Spray Chamber","Spray chamber berfungsi untuk menyeragamkan aerosol: membuang tetesan besar dan mencampur aerosol halus dengan oksidan dan bahan bakar sebelum masuk ke burner.","Tetesan besar menumbuk flow spoiler/dinding, mengembun, lalu mengalir ke drain; hanya tetesan halus yang terbawa aliran gas ke burner.","Hanya sekitar 5–15% sampel (aerosol halus) sampai ke flame sehingga nyala stabil dan sinyal reprodusibel.","Drain tidak terisi cairan penyekat (water seal) atau bocor → gas bocor dan bahaya flashback; efek memori antar sampel.",[-0.6,0.45,0.7]],
gasDoor:["Pintu Ruang Gas & Kompresor","Pintu akses ke area belakang tempat tabung asetilen dan kompresor udara disimpan; menjaga area gas tetap terkunci dan berventilasi.","Daun pintu baja berlouver ventilasi dengan tanda bahaya gas mudah terbakar, membuka ke arah luar. Klik pintu untuk membuka/menutup. Tidak boleh ada api, percikan, atau rokok di dekatnya.","Memberi akses petugas untuk membuka katup tabung, memeriksa regulator dan manometer, mengganti tabung, serta menguras kondensat kompresor.","Pintu tidak terkunci (akses tanpa izin), louver tertutup sehingga gas menumpuk, tabung tidak diikat, bau gas tercium saat pintu dibuka.",[-9.9,2,-3.2]],
waste:["Jerigen Pembuangan Limbah (Drain)","Jerigen pembuangan limbah berfungsi untuk menampung limbah cair dari drain spray chamber, yaitu sisa sampel dan tetesan besar yang tidak terbawa ke flame, secara aman.","Cairan limbah mengalir lewat selang drain secara gravitasi ke jerigen yang diletakkan lebih rendah dari spray chamber. Selang drain membentuk water seal (penyekat cairan) sehingga gas bakar tidak keluar lewat drain, dan sensor level drain memantau penuh-tidaknya cairan.","Menjaga aliran aerosol dan nyala tetap stabil serta aman (cairan tidak menumpuk di spray chamber), dan menampung limbah yang mengandung logam/asam untuk dibuang sesuai prosedur limbah laboratorium.","Jerigen penuh atau selang tertekuk → cairan menumpuk di spray chamber dan sinyal tidak stabil; water seal kering atau sambungan bocor → gas keluar dan bahaya flashback; jerigen tidak ditutup → uap asam/logam terlepas.",[0.5,-2.5,2.9]],
intro:["Sample Introduction System","Sistem pemasukan sampel berfungsi untuk mengalirkan larutan sampel dari wadah ke nebulizer secara kontinu.","Hisapan Venturi di nebulizer menarik larutan melalui kapiler (±4–6 mL/menit).","Jalur pertama sampel ke dalam instrumen.","Selang tertekuk, gelembung udara, partikel menyumbat, carry-over.",[-0.38,0.35,2]],
gas:["Gas Inlet & Koneksi Asetilen/Udara","Sistem gas berfungsi untuk menyediakan dan mengatur aliran bahan bakar (C₂H₂) dan oksidan (udara) ke burner secara terkontrol dan aman.","Kompresor udara bebas-oli menyuplai oksidan; water separator (filter 5 µm) dan botol kondensat menyingkirkan air dan partikel; regulator menjaga tekanan sesuai manual (asetilen tidak boleh melebihi ±0,1 MPa / 15 psi); valve solenoid membuka/menutup aliran, sensor tekanan memantau pasokan, dan safety valve melepas tekanan berlebih. Pada jalur asetilen, regulator dua manometer (tekanan tabung dan tekanan keluar) dilengkapi flashback arrestor; selang asetilen berwarna merah dan berulir kiri, tabung dipasang tegak dan diikat ke dinding agar asetonnya tidak ikut mengalir ke selang. Contoh pembacaan manometer pada model: tabung asetilen ±15 bar, tekanan keluar asetilen ±0,9 bar (di bawah batas 1 bar / 15 psi), tangki kompresor ±7 bar, dan tekanan keluar udara ±3,5 bar.","Rasio bahan bakar/oksidan menentukan suhu dan sifat nyala (oksidasi, stoikiometri, atau reduksi) sehingga memengaruhi efisiensi atomisasi.","Sambungan bocor (bahaya ledakan), tekanan tidak stabil, selang rusak.",[0,0.8,-1.85]],
optic:["Optical System","Sistem optik berfungsi untuk mengarahkan berkas lampu melewati flame menuju monokromator. Pada model ini badan instrumen diberi terowongan kosong (jalur cahaya) dari kompartemen lampu, melewati ruang atomisasi, hingga rongga di blok kiri (tertutup, tidak tembus keluar), sehingga berkas terlihat melintas di tengah alat.","Optik double-beam: berkas lampu dibagi menjadi berkas sampel yang melewati flame dan berkas referensi yang tidak melewati flame; perbandingan keduanya mengoreksi drift intensitas lampu.","Menjaga agar I₀ (tanpa penyerapan) dan I (setelah melewati flame) terukur akurat dengan baseline stabil.","Cermin kotor/berembun, optik tidak sejajar.",[1.3,2.4,0.6]],
mono:["Monokromator","Monokromator berfungsi untuk mengisolasi garis resonansi analitik dari garis lain yang dipancarkan lampu (gas isian, pengotor) dan dari emisi latar nyala.","Konfigurasi Czerny-Turner: celah masuk → cermin kolimator → kisi (grating) mendispersi cahaya → cermin fokus → celah keluar (lebar celah 0,2–2 nm menentukan lebar pita spektral yang diloloskan).","Menjamin hanya garis resonansi unsur yang sampai ke detektor; bersama modulasi lampu, emisi nyala yang tidak termodulasi tidak ikut terukur.","Drift panjang gelombang, slit salah, grating terkontaminasi.",[0.9,1.75,1]],
detector:["Detektor (PMT)","Detektor (PMT) berfungsi untuk mengubah intensitas cahaya (I₀ dan I) menjadi sinyal listrik yang sebanding dengan intensitasnya.","Foton membebaskan elektron di fotokatoda (efek fotoelektrik); elektron dipercepat ke deretan dinoda dan digandakan melalui emisi sekunder hingga menjadi arus yang terukur di anoda.","Perbandingan intensitas tanpa dan dengan atom di flame (I₀/I) menjadi dasar perhitungan absorbansi. Arus PMT dikirim lewat kabel ke papan pemroses sinyal di dalam instrumen, lalu lewat soket dan kabel USB ke CPU (aktifkan Tembus Pandang untuk melihatnya).","Tegangan PMT terlalu tinggi → noise; PMT lelah; kebocoran cahaya.",[1.3,1.8,0.2]],
panel:["Display / Control Panel","Panel kontrol/PC berfungsi untuk mengatur parameter pengukuran, mengolah sinyal detektor menjadi absorbansi dan konsentrasi, serta menampilkan hasil. Komputer awalnya mati: tekan tombol power CPU (tower) dan tombol power monitor (kanan bawah bezel) sesuai IK A.7, tunggu Windows booting, lalu klik layar untuk membuka kurva kalibrasi. Saat selesai, matikan lewat Shutdown Computer lalu matikan monitor (IK C.3–C.4).","Sinyal diolah menjadi A = log(I₀/I) lalu dibandingkan dengan kurva kalibrasi (A terhadap konsentrasi deret standar) untuk memperoleh konsentrasi sampel.","Mengubah sinyal menjadi absorbansi dan konsentrasi.","Kurva kalibrasi non-linear, baseline drift, gangguan komunikasi PC.",[3.7,1.8,0.8]],
tray:["Posisi Larutan Sampel (Sample Tray)","Posisi larutan sampel berfungsi untuk menyediakan larutan sampel atau standar yang akan dihisap kapiler ke nebulizer (opsional: autosampler ASC-7000).","Ujung kapiler dicelupkan ke larutan; larutan dihisap kontinu ke nebulizer oleh efek Venturi.","Titik awal alur sampel; konsentrasi larutan menentukan sinyal.","Kapiler tidak tercelup, gelembung udara, kontaminasi silang antar sampel.",[-0.38,0.55,2.4]],
exhaust:["Exhaust System","Exhaust berfungsi untuk membuang gas pembakaran, panas, dan uap logam dari ruang atomisasi sampai keluar gedung (bukan ke ruang gas).","Gas panas naik ke hood stainless; blower menghisapnya lewat hose fleksibel, lalu duct kaku menembus dinding pemisah, melintasi area belakang di atas ruang gas, menembus dinding luar ruangan, dan berakhir di cerobong gooseneck di luar gedung.","Menjaga keselamatan analis dan kestabilan nyala.","Hisapan lemah → nyala goyah, gas terakumulasi; duct bocor/korosi; pembuangan terlalu dekat jendela atau ventilasi masuk udara.",[-0.4,5.1,0.3]],
burnerAdj:["Burner Adjustment","Burner adjustment berfungsi untuk mengatur tinggi, posisi lateral, dan sudut burner agar berkas lampu melewati zona atom terpekat dan tidak mengenai kepala burner.","Sambil larutan standar disemprotkan, putar knob hingga absorbansi maksimum (berkas tepat melewati zona atom bebas paling padat).","Menentukan sensitivitas dan kestabilan pengukuran.","Tidak dioptimasi → sensitivitas rendah; burner terlalu rendah → berkas terhalang kepala burner.",[-0.7,1.15,1.35]],
interlock:["Safety Interlock","Safety interlock berfungsi untuk mencegah nyala hidup, atau mematikannya otomatis, bila kondisi tidak aman.","Sensor pintu, tekanan gas, level drain, dan flame sensor memutus gas otomatis; sensor getaran (standar AA-7000) juga memadamkan nyala otomatis saat ada guncangan.","Pintu harus tertutup selama nyala menyala.","Pintu tidak tertutup penuh → api tak menyala; bypass interlock berbahaya.",[0.28,1.65,1.5]],
cover:["Penutup Atas (Top Cover)","Penutup atas berfungsi untuk melindungi kompartemen lampu dan optik dari debu serta paparan tegangan tinggi/UV, sekaligus menjadi akses perawatan.","Penutup dilepas hanya saat lampu HCL dan nyala mati (klik penutup atas), lalu dipasang kembali dengan rapat.","Memberi akses perawatan ke bagian dalam (optik, cermin, lampu) tanpa membongkar instrumen.","Penutup tidak terpasang rapat → debu masuk ke optik; dibuka saat lampu menyala → tegangan tinggi dan UV berbahaya.",[-0.38,3.4,1.7]],
exhaustSw:["Saklar Exhaust","Saklar exhaust berfungsi untuk menyalakan dan mematikan sistem exhaust (hijau = ON, merah = OFF). Klik saklar untuk mengubah status.","Saklar memberi daya ke fan exhaust eksternal; saat ON fan menghisap gas panas dari hood lewat duct fleksibel ke luar ruangan.","Exhaust harus ON sebelum nyala dinyalakan; bila dimatikan saat simulasi, nyala ikut dihentikan.","Fan tidak menyala → panas dan uap logam menumpuk, nyala goyah; duct tersumbat atau bocor.",[-3.4,2.6,-3.3]],
ik:["Buku Instruksi Kerja (IK)","Buku IK berfungsi sebagai pedoman tertulis langkah kerja penggunaan AAS Shimadzu AA-7000 (kode IK/LAB.INST/10): persiapan alat, pengoperasian lewat perangkat lunak WizAArd, sampai prosedur mematikan alat. Klik buku untuk membacanya.","Analis membaca dan mengikuti IK secara berurutan: A. Persiapan (UPS, blower, kompresor, gas C₂H₂, lampu katoda, power alat dan PC), B. Instrumentasi (WizAArd, pemilihan unsur, purging, parameter lampu, kalibrasi, pengukuran), C. Mematikan alat.","Urutan kerja yang baku menjaga keselamatan (gas, nyala, tegangan lampu) dan keterulangan hasil pengukuran. Langkah pada simulasi (UPS, exhaust, saklar instrumen, lampu, PURGE/IGNITE, kurva kalibrasi) mengikuti IK ini.","Langkah terlewat atau tidak berurutan (mis. nyala dinyalakan sebelum purging selesai, atau UPS dimatikan sebelum komputer shutdown) → alat bermasalah atau tidak aman; Log Book tidak diisi.",[-3.1,1.95,.2]],
power:["Power / Control Section","Saklar utama berfungsi untuk menghubungkan dan memutus catu daya instrumen (klik untuk ON/OFF); tombol PURGE, IGNITE, dan EXTINGUISH mengendalikan jalur gas dan nyala.","Jalur listrik: stop kontak PLN → inlet UPS; tiga soket output UPS masing-masing ke instrumen AA-7000, CPU, dan monitor. Blower exhaust mendapat listrik PLN lewat saklar exhaust di dinding, kompresor udara langsung ke stop kontak PLN sendiri (bukan lewat UPS). Kabel USB membawa data instrumen ke PC dan kabel video menghubungkan CPU ke monitor. Catu daya instrumen menyuplai lampu, PMT, dan elektronik. PURGE membilas jalur gas, IGNITE menyalakan nyala, dan EXTINGUISH mematikan nyala dengan menutup aliran bahan bakar.","Instrumen baru dapat dioperasikan bila saklar utama dan UPS sama-sama ON.","Sekering putus, grounding buruk, tegangan listrik fluktuatif (karena itu dipakai UPS).",[0.8,2.5,1.55]]

function finEnter(){flameOn=flowOn=lampOn=false;A=0;fMix=0;setHL(['panel']);chips(11);setXray(false);flyTo(...PC_CAM);

function finish(){sim=null;pathMode=false;$('bSim').textContent='▶ Mulai Simulasi';openCal();}
function updateSim(dt){if(!sim)return;
  if(sim.pre){const P=sim.pre,S=PRE[P.i],dur=S?(typeof S.d==='function'?S.d():S.d):0;
    if(P.i<0||(P.t>=dur&&(!S.w||S.w()))){
      P.i++;P.t=0;if(P.i>=PRE.length){sim.pre=null;sim.t=0;sim.step=-1;return;}
      PRE[P.i].f(P);}
    else{P.t+=dt;if(S.u)S.u(Math.min(1,P.t/dur),P);}
    return;}
  sim.t+=dt;
  if(sim.t>=9*SD){
    if(sim.fin===undefined){sim.fin=0;scrT=0;finEnter();}
    sim.fin+=dt;scrT-=dt;if(scrT<0){scrT=.2;curveScr(99,true,res());}
    if(sim.fin>4)finish();
    return;}
  const s=Math.min(8,Math.floor(sim.t/SD));if(s!==sim.step){sim.step=s;enter(s);}
  A=sim.step>=5?cal.As*Math.min(1,(sim.t-5*SD)/(1.6*SD)):0;
  scrT-=dt;if(scrT<0){scrT=.1;hist.push([sim.t,A+(Math.random()-.5)*(A?.004:.002)]);plotScreen();}}

/* ===== KURVA KALIBRASI & TABEL PERHITUNGAN (klik monitor) — mengikuti sheet "Data Cu AAS": deret standar, penetapan kadar, presisi (%RPD), akurasi (%Rec) ===== */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const DEF=()=>({el:'Cu',wl:'324.7',unit:'mg/L',As:.10565,df:1,
  std:[[0,-.0017],[1,.1045],[2,.2033],[3,.2978],[4,.385],[5,.4812]],bl:.0007,blT:.0007,r:[.1056,.1057],sp:.2174,
  rd:[.0512,.0514],fpD:1,fp:1,fpS:1,cs:100,vs:.5,vt:49.5});
let cal=DEF();
const sync=()=>{const v=cal.r.filter(isFinite);cal.As=v.length?mean(v):0;cal.df=cal.fp||1;};   // sinkron dgn simulasi: A rata-rata ulangan; Kadar = (Konsentrasi − koreksi blanko) × Faktor pengenceran
// Regresi linear y = a + b·x (SLOPE, INTERCEPT, CORREL)
function fit(){const P=cal.std.filter(q=>isFinite(q[0])&&isFinite(q[1])),n=P.length;if(n<2)return null;
  const mx=mean(P.map(q=>q[0])),my=mean(P.map(q=>q[1]));let sxx=0,sxy=0,syy=0;P.forEach(([x,y])=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(y-my);syy+=(y-my)**2;});
  if(!sxx)return null;const m=sxy/sxx,b=my-m*mx,r=syy?sxy/Math.sqrt(sxx*syy):1;return{m,b,r,r2:r*r,P,n,mx,my,sxx};}
// Koreksi blanko bersyarat: Konsentrasi blanko dikurangkan HANYA bila lebih besar dari konsentrasi deret standar kedua; jika tidak, tidak dihitung sebagai koreksi
function blankCorr(f,bl){const cb=(bl-f.b)/f.m,xs=f.P.map(q=>q[0]).sort((x,y)=>x-y),s2=xs.length>1?xs[1]/10:NaN,use=isFinite(cb)&&isFinite(s2)&&cb>s2;return{cb,s2,use,val:use?cb:0};}
function res(){sync();const f=fit();if(!f||!f.m)return null;const cm=(cal.As-f.b)/f.m,bc=blankCorr(f,cal.blT);return{f,cm,c:(cm-bc.val)*cal.df};}
const eq=f=>'y = '+f.b.toFixed(4)+(f.m<0?' − ':' + ')+Math.abs(f.m).toFixed(4)+'x';
// Tabel penetapan kadar, presisi, akurasi
// Presisi otomatis: n = 2 → %RPD (selisih / rerata × 100); n > 2 → %RSD (SD / rerata × 100); n = 1 → tidak dihitung
function prec(K){const n=K.length,km=n?mean(K):NaN;if(n<2)return{n,km,type:'–',val:NaN,sel:NaN,sd:NaN};
  if(n===2){const sel=Math.abs(K[0]-K[1]);return{n,km,type:'%RPD',sel,sd:NaN,val:km?sel/km*100:NaN};}
  const sd=Math.sqrt(K.reduce((t,x)=>t+(x-km)*(x-km),0)/(n-1));return{n,km,type:'%RSD',sel:NaN,sd,val:km?sd/km*100:NaN};}
function calc(){sync();const f=fit();if(!f||!f.m)return null;const C=a=>(a-f.b)/f.m,bc=blankCorr(f,cal.blT),cb=bc.cb,bcD=blankCorr(f,cal.bl);
  const rows=cal.r.filter(isFinite).map(a=>{const c=C(a),ct=c-bc.val;return{a,c,ct,k:ct*cal.fp};});if(!rows.length)return null;
  const rowsD=cal.rd.filter(isFinite).map(a=>{const c=C(a),ct=c-bcD.val;return{a,c,ct,k:ct*cal.fpD};}),KD=rowsD.map(q=>q.k),kmD=KD.length?mean(KD):NaN,pD=prec(KD);
  const K=rows.map(q=>q.k),km=mean(K),pT=prec(K);
  const cs=C(cal.sp),ctSp=cs-bc.val,kSp=ctSp*cal.fpS,c2=cal.cs*cal.vs/cal.vt,rec=(kSp-km)/c2*100;
  return{f,cb,bc,cbD:bcD.cb,bcD,rows,rowsD,kmD,pD,km,pT,cs,ctSp,kSp,c2,rec};}
function resText(){const r=res();return r?'A = '+cal.As.toFixed(3)+' → C = <b>'+r.c.toFixed(2)+' '+esc(cal.unit)+'</b> ('+esc(cal.el)+' '+esc(cal.wl)+' nm; '+eq(r.f)+'). Klik monitor untuk melihat tabel perhitungan.':'Data kalibrasi belum valid (klik monitor).';}
function draw(){const cv=$('cv'),g=cv.getContext('2d'),W=480,Hh=300,L=50,R=14,T=14,Bm=38;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,Hh);
  const f=fit(),P=cal.std.filter(q=>isFinite(q[0])&&isFinite(q[1]));
  const xm=Math.max(1e-9,...P.map(q=>q[0]))*1.1,ym=Math.max(1e-9,...P.map(q=>q[1]))*1.1;
  const X=x=>L+x/xm*(W-L-R),Y=y=>Hh-Bm-y/ym*(Hh-Bm-T);
  g.strokeStyle='#1d4a58';g.fillStyle='#7f9aa8';g.font='11px system-ui';g.lineWidth=1;
  for(let i=0;i<=5;i++){const x=xm*i/5,y=ym*i/5;g.beginPath();g.moveTo(X(x),T);g.lineTo(X(x),Hh-Bm);g.moveTo(L,Y(y));g.lineTo(W-R,Y(y));g.stroke();g.fillText(x.toFixed(1),X(x)-8,Hh-Bm+14);g.fillText(y.toFixed(2),8,Y(y)+4);}
  g.fillStyle='#d6e6ee';g.fillText('Konsentrasi (mg/L)',W/2-45,Hh-6);g.save();g.translate(12,Hh/2+25);g.rotate(-Math.PI/2);g.fillText('Absorbansi',0,0);g.restore();
  if(f&&f.m){g.strokeStyle='#2dd4bf';g.lineWidth=2;g.beginPath();g.moveTo(X(0),Y(f.b));g.lineTo(X(xm),Y(f.m*xm+f.b));g.stroke();}
  g.fillStyle='#e6f6f4';P.forEach(q=>{g.beginPath();g.arc(X(q[0]),Y(q[1]),4,0,7);g.fill();});
  g.font='10px system-ui';g.fillStyle='#e6f6f4';g.fillText('● Standar',W-120,T+12);}
const nf=(x,d)=>isFinite(x)?x.toFixed(d):'–',nv=(x,d)=>!isFinite(x)?'–':(x!==0&&Math.abs(x)<Math.pow(10,-d)?x.toExponential(3):x.toFixed(d));
const tbl=(hd,rw)=>'<div style="overflow-x:auto"><table class="rt"><tr>'+hd.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rw.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';

        h='<h4>1 · Tabel hasil pengukuran deret standar</h4>'+tbl(['Konsentrasi deret '+el+' (mg/L) · Xi','Absorbansi terukur · Yi'],F.P.map(q=>[nv(q[0],2),nv(q[1],4)]).concat([['<b>Slope (b)</b>','<b>'+nv(F.m,4)+'</b>'],['<b>Intercept (a)</b>','<b>'+nv(F.b,4)+'</b>'],['<b>r</b>','<b>'+nv(F.r,4)+'</b>']]))+'<p class="fm">Persamaan regresi y = a + bx: '+eq(F)+' (n = '+F.n+')</p>';
    h+='<h4>2 · Tabel penetapan kadar '+el+' terlarut</h4><p class="fm">Konsentrasi = (Absorbansi − a) / b &nbsp;·&nbsp; Konsentrasi terkoreksi = Konsentrasi '+el+' − Konsentrasi blanko (hanya bila konsentrasi blanko &gt; konsentrasi deret standar kedua / 10) &nbsp;·&nbsp; Kadar = Konsentrasi terkoreksi × Faktor pengenceran</p>'

        [['Blanko Cu terlarut','blanko',nv(cal.bl,4),nv(k.cbD,4),'','','']].concat(k.rowsD.map((q,i)=>[i?'':'Cu terlarut',i+1,nv(q.a,4),nv(q.c,4),nv(cal.fpD,2),nv(q.ct,4),nv(q.k,4)])))

        [['Blanko Cu total','blanko',nv(cal.blT,4),nv(k.cb,4),'','','']].concat(k.rows.map((q,i)=>['',i+1,nv(q.a,4),nv(q.c,4),nv(cal.fp,2),nv(q.ct,4),nv(q.k,4)])));

      +tbl(['Kode sampel','Ulangan','Absorbansi','Konsentrasi '+el+' (mg/L)','Faktor pengenceran','Konsentrasi terkoreksi (mg/L)','Kadar '+el+' ('+u+') · C3'],[['Sampel akurasi (spike)',1,nv(cal.sp,4),nv(k.cs,8),nv(cal.fpS,2),nv(k.ctSp,9),nv(k.kSp,8)]])
