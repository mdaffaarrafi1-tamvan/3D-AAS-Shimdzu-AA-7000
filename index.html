<style>
/* ===== 7. STYLING / UI ===== */
:root{--bg:#0e1030;--pan:rgba(22,24,64,.95);--line:#3b3f8c;--teal:#2dd4bf;--txt:#e8eafc;--mut:#9aa0d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 system-ui,'Segoe UI',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{grid-area:h;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#15174a}
header b{color:var(--teal);letter-spacing:.5px}header span{color:var(--mut)}
aside{background:var(--pan);overflow:auto;padding:12px}
#left{grid-area:l;border-right:1px solid var(--line)}#right{grid-area:r;border-left:1px solid var(--line)}
h3{margin:12px 0 6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}h3:first-child{margin-top:0}
button{font:inherit;color:var(--txt);background:#1c2058;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--teal);background:#2a2f78}button.on{background:#0f766e;border-color:var(--teal)}
.mode,.comp{display:block;width:100%;text-align:left;margin-bottom:4px}.comp{font-size:12px;padding:4px 8px}
#view{grid-area:v;position:relative;min-width:0;background:radial-gradient(circle at 50% 35%,#3a2f8f,#12143a)}
#view canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(8px,-50%);font-size:11px;padding:2px 7px;background:rgba(16,18,56,.9);border:1px solid var(--teal);border-radius:10px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl:before{content:"";position:absolute;left:-9px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--teal)}
#tip{position:absolute;display:none;max-width:240px;padding:6px 9px;background:rgba(14,16,48,.96);border:1px solid var(--teal);border-radius:6px;font-size:12px;pointer-events:none}
#cap{position:absolute;left:12px;right:12px;bottom:10px;padding:8px 12px;background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:6px;transition:.3s}
#cap b{color:var(--teal)}
#info h2{margin:0 0 4px;font-size:16px;color:var(--teal)}#info h4{margin:10px 0 2px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}#info p{margin:0}
footer{grid-area:f;border-top:1px solid var(--line);background:#15174a;padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.chip{padding:3px 9px;border:1px solid var(--line);border-radius:12px;font-size:11px;color:var(--mut);transition:.4s}
.chip.done{color:var(--txt);border-color:#2a8a86}.chip.act{background:#0f766e;color:#fff;border-color:var(--teal);box-shadow:0 0 10px #2dd4bf88}
.arr{color:var(--line)}#btns{display:flex;gap:6px;flex-wrap:wrap}
#cal{position:absolute;inset:10px;display:none;overflow:auto;background:rgba(14,16,48,.98);border:1px solid var(--teal);border-radius:10px;padding:14px;z-index:5}#cal.show{display:block}
.cg{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.3fr);gap:16px;margin-top:8px}@media(max-width:900px){.cg{grid-template-columns:1fr}}
#cal h4{margin:10px 0 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
#cal label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}#cal label.ck{justify-content:flex-start}
#cal input{background:#171a52;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:110px;font:inherit}#cal table input{width:80px}#cal label.ck input{width:auto}#cal td{padding:2px 4px}#cr p{margin:6px 0}

*{-webkit-tap-highlight-color:transparent}
header{flex:none;height:48px;box-sizing:border-box;gap:10px;padding:0 10px}
header .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{flex:none;width:38px;height:36px;padding:0;font-size:18px;line-height:1;text-align:center}
#iBtn{margin-left:auto}

#left,#right{position:absolute;top:0;bottom:0;z-index:4;box-sizing:border-box;transition:transform .32s cubic-bezier(.4,0,.2,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#left{left:0;width:var(--dw);transform:translateX(-100%);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.35)}

#stage.noinfo #view{right:0}
#view canvas{touch-action:none}
#iX{display:none;float:right}
footer{flex:none}

#stage.menu #view{transform:translateX(var(--dw))}
#right{left:0;right:auto;top:auto;width:100%;max-height:50%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%);box-shadow:0 -4px 24px rgba(0,0,0,.35)}
#stage.noinfo #right{transform:translateY(100%)}
#stage.info #right{transform:none}
#iX{display:inline-block}
header .sub{display:none}
footer{flex-direction:column;align-items:stretch;gap:6px;padding:6px 8px}
#pipe,#btns{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#pipe>*,#btns>*{flex:none;white-space:nowrap}
button{padding:8px 12px}.mode{padding:10px}.comp{padding:9px 10px;font-size:13px}
#cap{left:8px;right:8px;bottom:8px;font-size:12px;max-height:34%;overflow:auto;padding:6px 10px}
#cal{inset:6px;padding:10px}
}

<!-- ===== 1. STRUKTUR APLIKASI ===== -->
<div id="app">
<header><button id="mBtn" class="hb" aria-label="Menu">☰</button><b>AAS · AA-7000</b><span class="sub">Simulasi 3D Atomic Absorption Spectrophotometer — media belajar (model edukasi, bukan replika resmi)</span><button id="iBtn" class="hb" aria-label="Info">ⓘ</button></header>

<script>
(()=>{
/* ===== 6. DATA PANEL INFORMASI =====
   Format: id:[Nama, Fungsi, Prinsip kerja, Hubungan dengan proses AAS, Contoh masalah, posisi label] */
const D={
lampComp:["Lamp Compartment","Rumah turet lampu DI DALAM instrumen, di sisi kanan bawah, tepat di bawah label tipe AA-7000 (jendela lampu menyala oranye saat lampu aktif); menjaga posisi & kestabilan lampu.","Turet memilih lampu aktif; cermin mengarahkan berkas ke ruang atomisasi; lampu cadangan dipanaskan (warm-up).","Menyediakan sumber radiasi garis untuk unsur yang diukur.","Lampu tidak sejajar → energi rendah; ventilasi buruk → baseline drift.",[1.45,.7,1.55]],
hcl:["Hollow Cathode Lamp (HCL)","Sumber garis emisi sempit khas unsur target (mis. Cu 324,7 nm).","Gas isian (Ne/Ar) terionisasi, menyputter atom katoda unsur target yang lalu tereksitasi dan memancarkan garis khas.","Radiasi ini diserap atom bebas dalam flame (Hukum Beer–Lambert).","Umur habis, intensitas turun, noise tinggi; arus lampu salah; salah pasang lampu.",[1.45,1.0,1]],
burner:["Burner Head","Menghasilkan nyala laminar dengan jalur optik panjang (slot ±10 cm udara–asetilen).","Campuran bahan bakar, oksidan, dan aerosol keluar dari celah sempit lalu terbakar.","Tempat aerosol berubah menjadi atom bebas.","Slot tersumbat garam → nyala tidak rata; rasio gas salah → flashback.",[-.38,1.25,1]],
flame:["Flame (Zona Atomisasi)","Zona panas (≈2300 °C udara–C₂H₂) tempat atomisasi berlangsung.","Aerosol: desolvasi (pelarut menguap) → vaporisasi (garam menjadi uap) → atomisasi (uap terurai menjadi atom bebas).","Menghasilkan atom keadaan dasar yang menyerap radiasi HCL.","Nyala terlalu kaya/miskin; interferensi kimia (oksida stabil), ionisasi.",[.15,1.65,1]],
nebulizer:["Nebulizer","Mengubah larutan sampel menjadi aerosol halus.","Aliran oksidan cepat di ujung kapiler menciptakan vakum (efek Venturi) yang menyedot sampel dan memecahnya menjadi tetesan.","Ukuran tetesan & laju hisap menentukan efisiensi atomisasi dan sensitivitas.","Kapiler tersumbat → sinyal turun/tidak stabil; impact bead rusak.",[-.38,.62,1.4]],
spray:["Spray Chamber","Memisahkan tetesan besar dan mencampur aerosol halus dengan gas bakar.","Flow spoiler/impact bead memecah tetesan; tetesan besar mengendap lalu mengalir ke drain.","Hanya aerosol halus (±10%) menuju flame sehingga nyala stabil.","Drain kering/bocor → bahaya flashback; efek memori antar sampel.",[-.6,.45,.7]],
intro:["Sample Introduction System","Kapiler/tubing PTFE dari wadah sampel menuju nebulizer.","Hisapan Venturi menarik larutan (±4–6 mL/menit).","Jalur pertama sampel ke dalam instrumen.","Selang tertekuk, gelembung udara, partikel menyumbat, carry-over.",[-.38,.35,2]],
gas:["Gas Inlet & Koneksi Asetilen/Udara","Menyalurkan bahan bakar (C₂H₂) dan oksidan (udara) terkontrol. Tabung asetilen & kompresor berada di belakang tembok pembatas (aktifkan Tembus Pandang atau putar kamera ke belakang).","Regulator & solenoid mengatur tekanan sesuai manual; sensor tekanan memantau pasokan.","Rasio bahan bakar/oksidan menentukan suhu dan sifat nyala.","Sambungan bocor (bahaya ledakan), tekanan tidak stabil, selang rusak.",[0,.8,-1.85]],
optic:["Optical System","Cermin & lensa mengarahkan berkas lampu melewati flame menuju monokromator.","AA-7000 memakai optik double-beam 3D: berkas dibagi, satu melewati nyala dan satu sebagai referensi, sehingga drift lampu terkompensasi.","Mempertahankan rasio I/I₀ yang akurat dan menekan drift.","Cermin kotor/berembun, optik tidak sejajar.",[1.3,2.4,.6]],
mono:["Monokromator","Memilih panjang gelombang analitik dan membuang emisi nyala.","Celah masuk → grating mendispersi cahaya → celah keluar (lebar celah 0,2–2 nm).","Menjamin hanya garis resonansi unsur yang sampai ke detektor.","Drift panjang gelombang, slit salah, grating terkontaminasi.",[.9,1.75,1]],
detector:["Detektor (PMT)","Mengubah intensitas cahaya menjadi sinyal listrik.","Foton membebaskan elektron di fotokatoda; dinoda menggandakannya menjadi arus terukur.","Rasio intensitas sebelum/sesudah nyala menjadi dasar perhitungan absorbansi.","Tegangan PMT terlalu tinggi → noise; PMT lelah; kebocoran cahaya.",[1.5,1.8,.2]],
panel:["Display / Control Panel","Tombol & indikator pada instrumen serta PC (perangkat lunak) untuk mengatur parameter dan menampilkan hasil. Klik monitor untuk membuka kurva kalibrasi. Kabel data biru menghubungkan instrumen dengan PC.","Sinyal diolah menjadi A = log(I₀/I) lalu dibandingkan dengan kurva kalibrasi.","Mengubah sinyal menjadi absorbansi dan konsentrasi.","Kurva kalibrasi non-linear, baseline drift, gangguan komunikasi PC.",[3.7,1.8,.8]],
tray:["Posisi Larutan Sampel (Sample Tray)","Tempat gelas/vial sampel atau standar; ujung kapiler dicelupkan ke larutan.","Kapiler putih menghisap larutan kontinu ke nebulizer (opsional: autosampler ASC-7000).","Titik awal alur sampel; konsentrasi larutan menentukan sinyal.","Kapiler tidak tercelup, gelembung udara, kontaminasi silang antar sampel.",[-.38,.55,2.4]],
exhaust:["Exhaust System","Hood stainless dan duct fleksibel yang membuang gas pembakaran dan uap logam keluar ruangan.","Cerobong di atas ruang atomisasi mengalirkan gas panas ke hood; fan eksternal menghisapnya lewat duct.","Menjaga keselamatan analis dan kestabilan nyala.","Hisapan lemah → nyala goyah, gas terakumulasi; duct bocor/korosi.",[-.4,5.1,.3]],
burnerAdj:["Burner Adjustment","Mengatur tinggi, sudut, dan posisi burner terhadap berkas cahaya.","Putar knob hingga berkas melewati zona atom terpekat (absorbansi standar maksimum).","Menentukan sensitivitas pengukuran.","Tidak dioptimasi → sensitivitas rendah; terlalu rendah → berkas terhalang.",[-.7,1.15,1.35]],
interlock:["Safety Interlock","Mencegah nyala hidup bila kondisi tidak aman.","Sensor pintu, tekanan gas, level drain, dan flame sensor memutus gas otomatis; sensor getaran (standar AA-7000) juga memadamkan nyala otomatis saat ada guncangan.","Pintu harus tertutup selama nyala menyala.","Pintu tidak tertutup penuh → api tak menyala; bypass interlock berbahaya.",[.28,1.65,1.5]],
power:["Power / Control Section","Saklar utama di strip bawah dan tombol kontrol/indikator di panel kanan.","Catu daya menyuplai lampu, PMT, dan elektronik; tombol memulai/menghentikan fungsi instrumen.","Dasar kerja seluruh sistem.","Sekering putus, grounding buruk, tegangan listrik fluktuatif (karena itu dipakai UPS).",[.8,2.5,1.55]]
};
const SHORT=id=>D[id][0].split(' (')[0];

/* ===== 2. MODEL 3D ===== */
const view=document.getElementById('view');
const scene=new THREE.Scene();{const g=document.createElement("canvas");g.width=4;g.height=512;const x=g.getContext("2d"),r=x.createLinearGradient(0,0,0,512);r.addColorStop(0,"#4a3aa8");r.addColorStop(.55,"#232766");r.addColorStop(1,"#12143a");x.fillStyle=r;x.fillRect(0,0,4,512);const t=new THREE.CanvasTexture(g);t.encoding=THREE.sRGBEncoding;scene.background=t;}
scene.fog=new THREE.Fog(0x232766,24,44);
const camera=new THREE.PerspectiveCamera(40,1,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio||1,2),3));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.insertBefore(renderer.domElement,view.firstChild);

// Pencahayaan laboratorium
scene.add(new THREE.HemisphereLight(0xcfe3f0,0x0b141b,.75));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(6,10,8);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-9,right:9,top:7,bottom:-7});scene.add(key);
const fill=new THREE.DirectionalLight(0x6fb4d8,.4);fill.position.set(-8,4,-4);scene.add(fill);
const flameLight=new THREE.PointLight(0xff9a3c,0,4);flameLight.position.set(-.38,1.55,1.2);scene.add(flameLight);
const lampLight=new THREE.PointLight(0xff8a3d,0,3.5);lampLight.position.set(1.45,.6,1.3);scene.add(lampLight);

// Material
const M=(c,r,m,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o));
const tx=c=>{const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t};
const mat={white:M(0xe9e7e1,.45,.1),grey:M(0x8d979f,.5,.2),dark:M(0x151b20,.6,.2),metal:M(0xb9c2ca,.35,.55),
 red:M(0xb23a3a,.5,.3),blue:M(0x2f6db5,.5,.3),tank:M(0xa9b3ba,.4,.4),
 glass:M(0x9fd8ff,.05,.1,{transparent:true,opacity:.2,depthWrite:false,side:THREE.DoubleSide}),
 plastic:M(0xf2f6f8,.3,0,{transparent:true,opacity:.55,depthWrite:false})};

const root=new THREE.Group();scene.add(root);
const byId={},pick=[],shells=[];
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d),C=(r,h,s=48)=>new THREE.CylinderGeometry(r,r,h,s);
// Helper: membuat mesh, memberi id komponen (agar bisa diklik) dan flag "shell" (bisa tembus pandang)
function add(geo,m,x,y,z,id,o={}){
  const me=new THREE.Mesh(geo,m.clone());me.position.set(x,y,z);
  if(o.rx)me.rotation.x=o.rx;if(o.rz)me.rotation.z=o.rz;
  (o.parent||root).add(me);me.castShadow=!m.transparent;me.receiveShadow=true;
  if(id){me.userData.id=id;(byId[id]=byId[id]||[]).push(me);pick.push(me);}
  if(o.shell){me.userData.shell=1;shells.push(me);}
  return me;}
function tube(pts,r,m,id){const g=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),96,r,16);
  const me=new THREE.Mesh(g,m.clone());root.add(me);if(id){me.userData.id=id;(byId[id]=byId[id]||[]).push(me);pick.push(me);}return me;}
const H=Math.PI/2;

// Meja lab, dinding belakang, UPS di kiri (sesuai foto)
add(B(16,.2,9),M(0x1c2058,.8,0),0,-.1,0);
const grid=new THREE.GridHelper(16,32,0x6a70d8,0x343a8c);grid.position.set(0,.003,0);scene.add(grid);
add(B(16,9,.2),M(0x2b3080,.9,0),0,4.4,-3.6,null,{shell:1});
add(B(.9,1.8,1.3),mat.dark,-3.1,.9,.2);add(B(1,.04,.7),M(0xe86aa6,.5,0),-3.1,1.82,.2);
// Pelat teks (tanpa logo)
function plate(t,w,h,x,y,z,bg,fg){const c=document.createElement('canvas');c.width=1024;c.height=Math.round(1024*h/w);const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,1024,c.height);g.fillStyle=fg;g.font='bold '+Math.round(c.height*.5)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,512,c.height/2,980);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx(c)}));m.position.set(x,y,z);root.add(m);}

// ===== Bodi: satu kabinet putih dari blok-blok agar ruang atomisasi berongga =====
// Ruang atomisasi: x -.93..0.17, y 1.05..1.85, z .5..1.5. Burner/flame berpusat di (-.38, ., 1.0)
add(B(3.5,.33,2.8),mat.dark,0,.165,0,'power');                       // strip dasar gelap
add(B(4.1,2.54,2),mat.white,0,1.6,-.5,'optic',{shell:1});             // blok belakang
add(B(1.12,2.54,1),mat.white,-1.49,1.6,1,'lampComp',{shell:1});       // blok kiri-depan
add(B(1.88,2.54,1),mat.white,1.11,1.6,1,'optic',{shell:1});           // blok kanan-depan (panel tombol)
add(B(1.1,1.02,1),mat.white,-.38,2.36,1,null,{shell:1});              // atas ruang atomisasi
add(B(1.1,.72,1),mat.white,-.38,.69,1,'spray',{shell:1});             // bawah ruang atomisasi (kompartemen spray chamber)
// Penutup hitam bagian atas (segilima) = rumah kompartemen lampu DI DALAM instrumen
const hs=new THREE.Shape();[[-1.25,2],[-1.43,2.85],[-.41,4.03],[.65,2.85],[.55,2]].forEach((q,i)=>i?hs.lineTo(q[0],q[1]):hs.moveTo(q[0],q[1]));
add(new THREE.ExtrudeGeometry(hs,{depth:1.32,bevelEnabled:false}),M(0x0b0d10,.25,.3),0,0,.2,null,{shell:1});
add(B(.9,.3,.02),M(0x020202,.1,.5),-.38,2.25,1.525,null);
const lampWin=add(B(.6,.36,.02),new THREE.MeshBasicMaterial({color:0x1a1a22}),1.45,.7,1.52,'lampComp'),wOff=new THREE.Color(0x1a1a22),wOn=new THREE.Color(0xff8a3d);
plate('ATOMIC ABSORPTION SPECTROPHOTOMETRY',.9,.1,-.38,3.5,1.535,'#ffffff','#222');plate('AA-7000',.55,.16,1.0,1.58,1.515,'#e8e6e0','#555');
// Penutup abu-abu bawah (kompartemen spray chamber)
const cs=new THREE.Shape();[[-1.25,.15],[-1.35,.9],[.58,.9],[.5,.15]].forEach((q,i)=>i?cs.lineTo(q[0],q[1]):cs.moveTo(q[0],q[1]));
add(new THREE.ExtrudeGeometry(cs,{depth:.06,bevelEnabled:false}),M(0x5c6168,.5,.2),0,0,1.5,'spray',{shell:1});
// Interior ruang atomisasi

function stop(){sim=null;pathMode=false;flameOn=flowOn=lampOn=false;A=0;fMix=0;hl=new Set();chips(-1);$('bSim').textContent='▶ Mulai Simulasi';$('bPath').classList.remove('on');
  screen('AA-7000 EDU','Status: STANDBY','Flame OFF · Lamp OFF');setMode('overview');}
function startSim(){stop();sim={t:0,step:-1};$('bSim').textContent='■ Hentikan Simulasi';doorOpen=false;$('bDoor').textContent='Buka Pintu';}
function enter(s){const S=STEP[s];hl=new Set(S[2]);chips(S[4]);flyTo(...MODES[S[3]].cam);setXray(s<=2||s>=5&&s<=7);
  caption(S[0],s===8?resText():S[1]);limit=S[5];
  if(s===0){flameOn=flowOn=true;}if(s===5)lampOn=true;
  hclGlow.material.opacity=lampOn?.9:0;}
function updateSim(dt){if(!sim)return;sim.t+=dt;const s=Math.min(8,Math.floor(sim.t/SD));if(s!==sim.step){sim.step=s;enter(s);}
  A=sim.step>=5?cal.As*Math.min(1,(sim.t-5*SD)/(1.6*SD)):0;
  scrT-=dt;if(scrT<0){scrT=.2;screen(sim.step>=5?'A = '+(A?(A+(Math.random()-.5)*.003).toFixed(3):'0.000'):'A = 0.000',sim.step>=8?(res()?cal.el+' C='+res().c.toFixed(2)+' '+cal.unit:'Kalibrasi?'):'Status: RUN','Flame ON · Lamp '+(lampOn?'ON':'OFF'));}}
$('bSim').onclick=()=>sim?stop():startSim();
$('bPath').onclick=()=>{if(sim)return;pathMode=!pathMode;$('bPath').classList.toggle('on',pathMode);
  if(pathMode){flameOn=flowOn=true;limit=1;hl=new Set(['intro','nebulizer','spray','burner','flame','tray']);setXray(true);flyTo([2.5,1.8,6.5],[-.2,1,1.2]);chips(0);
    caption('Jalur Sampel','Biru: tetesan → biru muda: aerosol halus → jingga/kuning: desolvasi & vaporisasi → teal: atom bebas.');}
  else stop();};
$('bPrin').onclick=()=>{hl=new Set(['hcl','flame','mono','detector']);flyTo(...MODES.optic.cam);setXray(true);selected=null;
  $('info').innerHTML='<h2>Prinsip Kerja AAS</h2><p>Atom bebas dalam keadaan dasar menyerap radiasi pada panjang gelombang khas unsurnya. Banyaknya radiasi yang diserap sebanding dengan konsentrasi atom.</p><h4>Hukum Beer–Lambert</h4><p>A = log(I₀/I) = ε · b · c<br>A: absorbansi, b: panjang jalur nyala, c: konsentrasi.</p><h4>Alur</h4><p>HCL → flame (atom menyerap) → monokromator → detektor → A → kurva kalibrasi → konsentrasi.</p>';
  caption('Prinsip Kerja','Berkas HCL melewati flame; absorbansi dihitung dari I₀/I.');};
$('bLbl').onclick=()=>{labelsOn=!labelsOn;$('bLbl').classList.toggle('on',labelsOn);};
$('bX').onclick=()=>setXray(!xray);$('bDoor').onclick=toggleDoor;$('bCam').onclick=()=>{flyTo(HOME.p,HOME.t);};

/* ===== KURVA KALIBRASI (klik monitor) ===== */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({el:'Cu',wl:'324.7',unit:'mg/L',df:1,As:.215,zero:false,std:[[0,0],[1,.105],[2,.208],[3,.31],[4,.415],[5,.52]]});
let cal=DEF();
// Regresi linear y = m·x + b (kuadrat terkecil), R², lalu konsentrasi sampel x = (A − b)/m × faktor pengenceran
function fit(){const P=cal.std.filter(q=>isFinite(q[0])&&isFinite(q[1])),n=P.length;if(n<2)return null;
  let sx=0,sy=0,sxx=0,sxy=0;P.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;});let m,b;
  if(cal.zero){if(!sxx)return null;m=sxy/sxx;b=0;}else{const d=n*sxx-sx*sx;if(!d)return null;m=(n*sxy-sx*sy)/d;b=(sy-m*sx)/n;}
  const my=sy/n;let st=0,sr=0;P.forEach(([x,y])=>{st+=(y-my)**2;sr+=(y-(m*x+b))**2;});return{m,b,r2:st?1-sr/st:1,P};}
function res(){const f=fit();if(!f||!f.m)return null;const cm=(cal.As-f.b)/f.m;return{f,cm,c:cm*cal.df};}
const eq=f=>'y = '+f.m.toFixed(4)+'x '+(f.b<0?'− ':'+ ')+Math.abs(f.b).toFixed(4);
function resText(){const r=res();return r?'A = '+cal.As.toFixed(3)+' → C = <b>'+r.c.toFixed(2)+' '+esc(cal.unit)+'</b> ('+esc(cal.el)+' '+esc(cal.wl)+' nm; '+eq(r.f)+'). Klik monitor untuk mengubah kurva.':'Data kalibrasi belum valid (klik monitor).';}
function draw(){const cv=$('cv'),g=cv.getContext('2d'),W=480,Hh=300,L=50,R=14,T=14,Bm=38;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,Hh);
  const r=res(),P=cal.std.filter(q=>isFinite(q[0])&&isFinite(q[1]));const cs=r?Math.max(0,r.cm):0;
  const xm=Math.max(1e-9,...P.map(q=>q[0]),cs)*1.1,ym=Math.max(1e-9,...P.map(q=>q[1]),cal.As)*1.1;
  const X=x=>L+x/xm*(W-L-R),Y=y=>Hh-Bm-y/ym*(Hh-Bm-T);
  g.strokeStyle='#1d4a58';g.fillStyle='#7f9aa8';g.font='11px system-ui';g.lineWidth=1;
  for(let i=0;i<=5;i++){const x=xm*i/5,y=ym*i/5;g.beginPath();g.moveTo(X(x),T);g.lineTo(X(x),Hh-Bm);g.moveTo(L,Y(y));g.lineTo(W-R,Y(y));g.stroke();g.fillText(x.toFixed(1),X(x)-8,Hh-Bm+14);g.fillText(y.toFixed(2),8,Y(y)+4);}
  g.fillStyle='#d6e6ee';g.fillText('Konsentrasi ('+cal.unit+')',W/2-45,Hh-6);g.save();g.translate(12,Hh/2+25);g.rotate(-Math.PI/2);g.fillText('Absorbansi',0,0);g.restore();
  if(r){g.strokeStyle='#2dd4bf';g.lineWidth=2;g.beginPath();g.moveTo(X(0),Y(r.f.b));g.lineTo(X(xm),Y(r.f.m*xm+r.f.b));g.stroke();
    g.setLineDash([5,4]);g.strokeStyle='#f59e0b';g.lineWidth=1;g.beginPath();g.moveTo(L,Y(cal.As));g.lineTo(X(cs),Y(cal.As));g.lineTo(X(cs),Hh-Bm);g.stroke();g.setLineDash([]);
    g.fillStyle='#f59e0b';g.beginPath();g.arc(X(cs),Y(cal.As),6,0,7);g.fill();}
  g.fillStyle='#e6f6f4';P.forEach(q=>{g.beginPath();g.arc(X(q[0]),Y(q[1]),4,0,7);g.fill();});}
function upd(){const r=res();draw();let h='<p>Isi minimal 2 standar yang valid.</p>';
  if(r){const ys=r.f.P.map(q=>q[1]),w=[];if(cal.As>Math.max(...ys)||cal.As<Math.min(...ys))w.push('Absorbansi sampel di luar rentang standar (ekstrapolasi): encerkan sampel atau perluas standar.');if(r.f.r2<.995)w.push('R² &lt; 0,995: kurva kurang linear.');
    h='<p>Persamaan: <b>'+eq(r.f)+'</b> · R² = <b>'+r.f.r2.toFixed(4)+'</b></p><p>Konsentrasi terukur: '+r.cm.toFixed(3)+' '+esc(cal.unit)+(cal.df!==1?' × pengenceran '+cal.df+' = ':' → ')+'<b style="color:#f59e0b;font-size:16px">'+r.c.toFixed(3)+' '+esc(cal.unit)+'</b> '+esc(cal.el)+'</p>'+w.map(t=>'<p style="color:#f59e0b">⚠ '+t+'</p>').join('');}
  $('cr').innerHTML=h;}
function renderCal(){$('cal').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;color:var(--teal);font-size:16px">Kurva Kalibrasi &amp; Perhitungan Kadar</h2><button id="cX">✕ Tutup</button></div>
<div class="cg"><div><h4>Parameter</h4><label>Unsur<input id="ce"></label><label>λ (nm)<input id="cw"></label><label>Satuan<input id="cu"></label>
<label>Faktor pengenceran<input id="cd" type="number" step="any" min="0"></label><label>Absorbansi sampel<input id="ca" type="number" step="any"></label>
<label class="ck"><input id="cz" type="checkbox"> Regresi melalui titik nol</label><h4>Larutan standar (konsentrasi · absorbansi)</h4><table id="ct"></table>
<p><button id="cAdd">+ Standar</button> <button id="cRst">Reset</button> <button id="cRun">▶ Simulasikan dengan data ini</button></p></div>
<div><canvas id="cv" width="960" height="600" style="width:100%;max-width:560px"></canvas><div id="cr"></div></div></div>`;
  $('ce').value=cal.el;$('cw').value=cal.wl;$('cu').value=cal.unit;$('cd').value=cal.df;$('ca').value=cal.As;$('cz').checked=cal.zero;
  $('ct').innerHTML=cal.std.map((q,i)=>'<tr><td>'+(i+1)+'</td>'+[0,1].map(j=>'<td><input type="number" step="any" data-i="'+i+'" data-j="'+j+'" value="'+(isNaN(q[j])?'':q[j])+'"></td>').join('')+'<td><button data-d="'+i+'">×</button></td></tr>').join('');
  upd();}
function openCal(){$('cal').classList.add('show');renderCal();}
$('cal').addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.i!==undefined)cal.std[+d.i][+d.j]=parseFloat(t.value);
  else{const m={ce:()=>cal.el=t.value,cw:()=>cal.wl=t.value,cu:()=>cal.unit=t.value,cd:()=>cal.df=parseFloat(t.value)||1,ca:()=>cal.As=parseFloat(t.value)||0,cz:()=>cal.zero=t.checked};if(m[t.id])m[t.id]();}upd();});
$('cal').addEventListener('click',e=>{const t=e.target,d=t.dataset;
  if(t.id==='cX')$('cal').classList.remove('show');
  else if(t.id==='cAdd'){cal.std.push([NaN,NaN]);renderCal();}
  else if(t.id==='cRst'){cal=DEF();renderCal();}
  else if(t.id==='cRun'){$('cal').classList.remove('show');startSim();}
  else if(d.d!==undefined){cal.std.splice(+d.d,1);renderCal();}});
$('bCal').onclick=openCal;

/* ===== LOOP ANIMASI ===== */
const clock=new THREE.Clock();
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
const v3=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  updateSim(dt);
  if(goal){camera.position.lerp(goal.p,.06);controls.target.lerp(goal.t,.06);if(camera.position.distanceTo(goal.p)<.03)goal=null;}
  controls.update();
  door.rotation.x+=((doorOpen?-1.6:0)-door.rotation.x)*.1; led.material.color.setHex(doorOpen?0xff3b3b:0x34d399);
  // nyala + cahaya
  flame.visible=flameOn;if(flameOn){if(pathMode)pathT+=dt;else pathT=0;
    const fT=sim?(sim.step>=3?1:0):(pathMode&&pathT>4?1:0);fMix+=(fT-fMix)*Math.min(1,dt*1.6);
    fO.material.color.lerpColors(cB[0],cO[0],fMix);fM.material.color.lerpColors(cB[1],cO[1],fMix);fI.material.color.lerpColors(cB[2],cO[2],fMix);fR.material.color.lerpColors(cB[4],cO[4],fMix);flameLight.color.lerpColors(cB[3],cO[3],fMix);
    const fs=1+.45*fMix;flame.scale.set(fs,fs*(1+.1*Math.sin(t*18)+.05*Math.sin(t*31)),fs);flameLight.intensity=(.8+.5*fMix)+.3*Math.sin(t*20);}else flameLight.intensity=0;
  // berkas cahaya (transmitansi T = 10^-A)
  const T=Math.pow(10,-A),L=lampOn?1:0;beams[0].material.opacity=.7*L;beams[1].material.opacity=.7*L;beams[2].material.opacity=.7*L;beams[3].material.opacity=.8*L;beams[4].material.opacity=.7*L*T;beams[5].material.opacity=.7*L*T;
  hclGlow.material.opacity=L*(.75+.15*Math.sin(t*10));hclHalo.material.opacity=L*(.28+.06*Math.sin(t*10));lampWin.material.color.lerpColors(wOff,wOn,L*(.8+.15*Math.sin(t*10)));lampLight.intensity=L*(1.6+.3*Math.sin(t*10));
  pts.visible=flowOn;if(flowOn)updateParticles(dt,limit);
  // highlight komponen
  const k=.3+.22*Math.sin(t*4);pick.forEach(m=>{const mm=m.material;if(!mm.emissive)return;const id=m.userData.id;
    mm.emissive.setHex(0x14b8a6);mm.emissiveIntensity=id===selected?k+.25:hl.has(id)?k:id===hover?.18:0;});
  // posisi label
  const W=view.clientWidth,Hh=view.clientHeight;
  for(const id in labels){const l=labels[id];if(!labelsOn){l.style.display='none';continue;}v3.set(...D[id][5]).project(camera);
    if(v3.z>1){l.style.display='none';continue;}l.style.display='block';l.style.left=(v3.x*.5+.5)*W+'px';l.style.top=(-v3.y*.5+.5)*Hh+'px';}
  renderer.render(scene,camera);}
if(!isMob())stage.classList.add('menu');
$('mBtn').onclick=()=>stage.classList.toggle('menu');
$('iBtn').onclick=()=>stage.classList.toggle(isMob()?'info':'noinfo');
$('iX').onclick=()=>stage.classList.remove('info');
welcome();setMode('overview');loop();
})();
</script>
