<html lang="id"><head><meta charset="utf-8">

<title>AAS AA-7000 — Simulasi 3D Interaktif</title>
<style>
/* ===== 7. STYLING / UI ===== */
:root{--bg:#0e1030;--pan:rgba(22,24,64,.95);--line:#3b3f8c;--teal:#2dd4bf;--txt:#e8eafc;--mut:#9aa0d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 system-ui,'Segoe UI',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{grid-area:h;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#15174a}
header b{color:var(--teal);letter-spacing:.5px}header span{color:var(--mut)}
aside{background:var(--pan);overflow:auto;padding:12px}
#left{grid-area:l;border-right:1px solid var(--line)}#right{grid-area:r;border-left:1px solid var(--line)}
h3{margin:12px 0 6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}h3:first-child{margin-top:0}
button{font:inherit;color:var(--txt);background:#1c2058;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--teal);background:#2a2f78}button.on{background:#0f766e;border-color:var(--teal)}
.mode,.comp{display:block;width:100%;text-align:left;margin-bottom:4px}.comp{font-size:12px;padding:4px 8px}
#view{grid-area:v;position:relative;min-width:0;background:radial-gradient(circle at 50% 35%,#3a2f8f,#12143a)}
#view canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(8px,-50%);font-size:11px;padding:2px 7px;background:rgba(16,18,56,.9);border:1px solid var(--teal);border-radius:10px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl:before{content:"";position:absolute;left:-9px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--teal)}
#tip{position:absolute;display:none;max-width:240px;padding:6px 9px;background:rgba(14,16,48,.96);border:1px solid var(--teal);border-radius:6px;font-size:12px;pointer-events:none}
#cap{position:absolute;left:12px;right:12px;bottom:10px;padding:8px 12px;background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:6px;transition:.3s}
#cap b{color:var(--teal)}
#info h2{margin:0 0 4px;font-size:16px;color:var(--teal)}#info h4{margin:10px 0 2px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}#info p{margin:0}
footer{grid-area:f;border-top:1px solid var(--line);background:#15174a;padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#pipe{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{padding:3px 9px;border:1px solid var(--line);border-radius:12px;font-size:11px;color:var(--mut);transition:.4s}
.chip.done{color:var(--txt);border-color:#2a8a86}.chip.act{background:#0f766e;color:#fff;border-color:var(--teal);box-shadow:0 0 10px #2dd4bf88}
.arr{color:var(--line)}#btns{display:flex;gap:6px;flex-wrap:wrap}
#cal{position:absolute;inset:10px;display:none;overflow:auto;background:rgba(14,16,48,.98);border:1px solid var(--teal);border-radius:10px;padding:14px;z-index:5}#cal.show{display:block}
.cg{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.3fr);gap:16px;margin-top:8px}@media(max-width:900px){.cg{grid-template-columns:1fr}}
#cal h4{margin:10px 0 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
#cal label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}#cal label.ck{justify-content:flex-start}
#cal input{background:#171a52;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:110px;font:inherit}#cal table input{width:80px}#cal label.ck input{width:auto}#cal td{padding:2px 4px}#cr p{margin:6px 0}

*{-webkit-tap-highlight-color:transparent}
header{flex:none;height:48px;box-sizing:border-box;gap:10px;padding:0 10px}
header .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{flex:none;width:38px;height:36px;padding:0;font-size:18px;line-height:1;text-align:center}
#iBtn{margin-left:auto}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;--dw:210px;--rw:330px}
#left,#right{position:absolute;top:0;bottom:0;z-index:4;box-sizing:border-box;transition:transform .32s cubic-bezier(.4,0,.2,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#left{left:0;width:var(--dw);transform:translateX(-100%);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.35)}
#stage.menu #left{transform:none}
#right{right:0;width:var(--rw)}
#stage.noinfo #right{transform:translateX(100%)}
#view{position:absolute;top:0;bottom:0;left:0;right:var(--rw);transition:left .32s cubic-bezier(.4,0,.2,1),right .32s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.4,0,.2,1)}
#stage.menu #view{left:var(--dw)}
#stage.noinfo #view{right:0}
#view canvas{touch-action:none}
#iX{display:none;float:right}
footer{flex:none}
@media(max-width:900px){
#stage{--dw:min(72vw,250px)}
#view,#stage.menu #view,#stage.noinfo #view{left:0;right:0}
#stage.menu #view{transform:translateX(var(--dw))}
#right{left:0;right:auto;top:auto;width:100%;max-height:50%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%);box-shadow:0 -4px 24px rgba(0,0,0,.35)}
#stage.noinfo #right{transform:translateY(100%)}
#stage.info #right{transform:none}
#iX{display:inline-block}
header .sub{display:none}
footer{flex-direction:column;align-items:stretch;gap:6px;padding:6px 8px}
#pipe,#btns{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#pipe>*,#btns>*{flex:none;white-space:nowrap}
button{padding:8px 12px}.mode{padding:10px}.comp{padding:9px 10px;font-size:13px}
#cap{left:8px;right:8px;bottom:8px;font-size:12px;max-height:34%;overflow:auto;padding:6px 10px}
#cal{inset:6px;padding:10px}
}

/* caption ringkas di pojok kiri-atas agar tidak menutupi model */
#view #cap{left:10px;right:auto;top:10px;bottom:auto;width:auto;max-width:min(340px,calc(100% - 20px));padding:6px 10px;font-size:12px;line-height:1.35;background:rgba(14,16,48,.88);pointer-events:none}
#view #cap b{display:block;font-size:12px}
/* warna tombol lebih tajam */
button{background:#232a8a;border-color:#7b84ff;color:#fff}
button:hover{background:#3340d6;border-color:var(--teal)}
button.on{background:#0d9488;border-color:#5eead4}
#bSim{background:#15803d;border-color:#4ade80;font-weight:700}
.chip{color:#c9ceff;border-color:#5b62c8}.chip.done{color:#fff;border-color:#2dd4bf}

/* menu bawah dapat digeser kiri-kanan (sentuh/seret/roda mouse) */
footer{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;gap:6px;min-width:0;max-width:100%;overflow:hidden}
#pipe,#btns{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;min-width:0;max-width:100%;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#5b62c8 transparent;padding-bottom:3px}
#pipe>*,#btns>*{flex:none;white-space:nowrap}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}.st div{background:#171a52;border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}.st small{display:block;color:var(--mut);font-size:10px}.st b{font-size:14px;color:var(--teal)}
.rt{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.rt th,.rt td{border:1px solid var(--line);padding:3px 6px;text-align:right}.rt th:first-child,.rt td:first-child{text-align:left}
#cr .fm{color:var(--mut);font-size:12px}#cr .ok{color:#34d399}#cr .bad{color:#f59e0b}
</style></head>

<!-- ===== 1. STRUKTUR APLIKASI ===== -->
<div id="app">
<header><button id="mBtn" class="hb" aria-label="Menu">☰</button><b>AAS · AA-7000</b><span class="sub">Simulasi 3D Atomic Absorption Spectrophotometer — media belajar (model edukasi, bukan replika resmi)</span><button id="iBtn" class="hb" aria-label="Info">ⓘ</button></header>
<div id="stage"><aside id="left"><h3>Explore Instrument</h3><div id="modes"></div><h3>Komponen</h3><div id="list"></div></aside>
<main id="view"><div id="labels"></div><div id="tip"></div><div id="cap"></div><div id="cal"></div></main>
<aside id="right"><button id="iX">✕ Tutup</button><div id="info"></div></aside></div>
<footer><div id="pipe"></div>
<div id="btns"><button id="bSim">▶ Mulai Simulasi</button><button id="bLbl">Lihat Komponen</button><button id="bPath">Jalur Sampel</button><button id="bPrin">Prinsip Kerja</button><button id="bX">Tembus Pandang</button><button id="bDoor">Buka Pintu</button><button id="bLamp">Buka Pintu Lampu</button><button id="bCover">Lepas Penutup Atas</button><button id="bTur">Putar Turret ⟳</button><button id="bCal">Kurva Kalibrasi</button><button id="bCam">Reset Kamera</button></div></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{
/* ===== 6. DATA PANEL INFORMASI =====
   Format: id:[Nama, Fungsi, Prinsip kerja, Hubungan dengan proses AAS, Contoh masalah, posisi label] */
const D={
lampDoor:["Pintu Kompartemen Lampu HCL","Pintu lampu katoda berfungsi untuk melindungi kompartemen lampu HCL dari debu dan cahaya luar, mencegah operator menyentuh bagian bertegangan tinggi, serta menjadi akses penggantian lampu.","Pintu hanya dibuka saat lampu mati. Lampu yang dipilih diputar ke posisi aktif (turret) atau dicabut dari soketnya (4 pin) untuk diganti, lalu pintu ditutup kembali.","Lampu yang tepat (unsur & arus) menentukan panjang gelombang dan sensitivitas pengukuran.","Salah pasang pin/lampu tidak sejajar → energi rendah; membuka pintu saat lampu menyala berbahaya (tegangan tinggi).",[1.71,1.5,1.6]],
lampComp:["Lamp Compartment","Kompartemen lampu berfungsi untuk menempatkan beberapa lampu HCL, memilih lampu unsur yang digunakan, dan memanaskan lampu berikutnya (warm-up) agar emisinya stabil.","Turret diputar untuk memilih lampu aktif; cermin mengarahkan berkas lampu ke ruang atomisasi.","Menyediakan sumber radiasi garis untuk unsur yang diukur.","Lampu tidak sejajar → energi rendah; ventilasi buruk → baseline drift.",[1.71,0.7,1.5]],
hcl:["Hollow Cathode Lamp (HCL)","HCL berfungsi sebagai sumber radiasi garis sempit yang khas untuk unsur analit (mis. lampu Cu: garis resonansi 324,7 nm), yaitu radiasi yang akan diserap atom analit di flame.","Tegangan tinggi antara anoda dan katoda mengionisasi gas isian (Ne/Ar). Ion positif dipercepat menumbuk katoda berongga sehingga atom logam terlepas (sputtering), lalu atom itu tereksitasi oleh tumbukan dan memancarkan garis emisi sempit khas unsurnya saat kembali ke keadaan dasar.","Panjang gelombang garis ini sama dengan garis serapan atom unsur yang sama di dalam flame, sehingga hanya atom analit yang menyerapnya (selektif); penyerapannya mengikuti Hukum Beer–Lambert.","Umur habis, intensitas turun, noise tinggi; arus lampu salah; salah pasang lampu.",[1.51,0.95,1]],
burner:["Burner Head","Burner berfungsi untuk mengalirkan campuran aerosol sampel, bahan bakar, dan oksidan ke nyala serta membentuk nyala laminar yang stabil dengan jalur optik panjang.","Campuran homogen dari spray chamber keluar melalui slot dengan kecepatan lebih besar daripada kecepatan pembakaran sehingga nyala stabil di atas burner dan tidak merambat balik ke dalam.","Menyediakan jalur optik panjang (b) untuk Hukum Beer–Lambert (slot ±10 cm untuk udara–asetilen, ±5 cm untuk N₂O–asetilen): makin panjang b, makin besar absorbansi.","Slot tersumbat garam/karbon → nyala tidak rata dan sinyal tidak stabil; kecepatan gas terlalu rendah atau drain bermasalah → flashback.",[-0.38,1.75,1]],
flame:["Flame (Zona Atomisasi)","Flame berfungsi sebagai tempat atomisasi, yaitu mengubah analit dalam aerosol menjadi atom bebas keadaan dasar pada suhu ≈2300 °C (udara–C₂H₂).","Aerosol melewati tiga tahap: desolvasi (pelarut menguap, tersisa partikel padat) → vaporisasi (padatan menjadi uap molekul) → atomisasi (molekul terdisosiasi menjadi atom bebas keadaan dasar).","Menghasilkan atom bebas keadaan dasar dengan jumlah sebanding dengan konsentrasi analit; atom inilah yang menyerap radiasi HCL.","Komposisi nyala terlalu kaya/miskin bahan bakar; interferensi kimia (senyawa stabil seperti oksida/fosfat), ionisasi atom, emisi nyala.",[0.15,1.65,1]],
nebulizer:["Nebulizer","Nebulizer berfungsi untuk menghisap larutan sampel dan mengubahnya menjadi aerosol (kabut halus).","Oksidan (udara) mengalir cepat melewati ujung kapiler sehingga tekanan di sana turun (efek Venturi, prinsip Bernoulli); larutan terhisap naik lalu terpecah menjadi tetesan, kemudian ditumbukkan ke impact bead agar tetesan menjadi lebih halus.","Ukuran tetesan dan laju hisap menentukan jumlah analit yang sampai ke flame, sehingga memengaruhi sensitivitas.","Kapiler tersumbat → sinyal turun/tidak stabil; impact bead rusak.",[-0.38,1.25,1.3]],
spray:["Spray Chamber","Spray chamber berfungsi untuk menyeragamkan aerosol: membuang tetesan besar dan mencampur aerosol halus dengan oksidan dan bahan bakar sebelum masuk ke burner.","Tetesan besar menumbuk flow spoiler/dinding, mengembun, lalu mengalir ke drain; hanya tetesan halus yang terbawa aliran gas ke burner.","Hanya sekitar 5–15% sampel (aerosol halus) sampai ke flame sehingga nyala stabil dan sinyal reprodusibel.","Drain tidak terisi cairan penyekat (water seal) atau bocor → gas bocor dan bahaya flashback; efek memori antar sampel.",[-0.6,0.45,0.7]],
waste:["Jerigen Pembuangan Limbah (Drain)","Jerigen pembuangan limbah berfungsi untuk menampung limbah cair dari drain spray chamber, yaitu sisa sampel dan tetesan besar yang tidak terbawa ke flame, secara aman.","Cairan limbah mengalir lewat selang drain secara gravitasi ke jerigen yang diletakkan lebih rendah dari spray chamber. Selang drain membentuk water seal (penyekat cairan) sehingga gas bakar tidak keluar lewat drain, dan sensor level drain memantau penuh-tidaknya cairan.","Menjaga aliran aerosol dan nyala tetap stabil serta aman (cairan tidak menumpuk di spray chamber), dan menampung limbah yang mengandung logam/asam untuk dibuang sesuai prosedur limbah laboratorium.","Jerigen penuh atau selang tertekuk → cairan menumpuk di spray chamber dan sinyal tidak stabil; water seal kering atau sambungan bocor → gas keluar dan bahaya flashback; jerigen tidak ditutup → uap asam/logam terlepas.",[0.9,0.75,2.7]],
intro:["Sample Introduction System","Sistem pemasukan sampel berfungsi untuk mengalirkan larutan sampel dari wadah ke nebulizer secara kontinu.","Hisapan Venturi di nebulizer menarik larutan melalui kapiler (±4–6 mL/menit).","Jalur pertama sampel ke dalam instrumen.","Selang tertekuk, gelembung udara, partikel menyumbat, carry-over.",[-0.38,0.35,2]],
gas:["Gas Inlet & Koneksi Asetilen/Udara","Sistem gas berfungsi untuk menyediakan dan mengatur aliran bahan bakar (C₂H₂) dan oksidan (udara) ke burner secara terkontrol dan aman.","Kompresor udara bebas-oli menyuplai oksidan; water separator (filter 5 µm) dan botol kondensat menyingkirkan air dan partikel; regulator menjaga tekanan sesuai manual (asetilen tidak boleh melebihi ±0,1 MPa / 15 psi); valve solenoid membuka/menutup aliran, sensor tekanan memantau pasokan, dan safety valve melepas tekanan berlebih. Pada jalur asetilen, regulator dua manometer (tekanan tabung dan tekanan keluar) dilengkapi flashback arrestor; selang asetilen berwarna merah dan berulir kiri, tabung dipasang tegak dan diikat ke dinding agar asetonnya tidak ikut mengalir ke selang. Contoh pembacaan manometer pada model: tabung asetilen ±15 bar, tekanan keluar asetilen ±0,9 bar (di bawah batas 1 bar / 15 psi), tangki kompresor ±7 bar, dan tekanan keluar udara ±3,5 bar.","Rasio bahan bakar/oksidan menentukan suhu dan sifat nyala (oksidasi, stoikiometri, atau reduksi) sehingga memengaruhi efisiensi atomisasi.","Sambungan bocor (bahaya ledakan), tekanan tidak stabil, selang rusak.",[0,0.8,-1.85]],
optic:["Optical System","Sistem optik berfungsi untuk mengarahkan berkas lampu melewati flame menuju monokromator.","Optik double-beam: berkas lampu dibagi menjadi berkas sampel yang melewati flame dan berkas referensi yang tidak melewati flame; perbandingan keduanya mengoreksi drift intensitas lampu.","Menjaga agar I₀ (tanpa penyerapan) dan I (setelah melewati flame) terukur akurat dengan baseline stabil.","Cermin kotor/berembun, optik tidak sejajar.",[1.3,2.4,0.6]],
mono:["Monokromator","Monokromator berfungsi untuk mengisolasi garis resonansi analitik dari garis lain yang dipancarkan lampu (gas isian, pengotor) dan dari emisi latar nyala.","Konfigurasi Czerny-Turner: celah masuk → cermin kolimator → kisi (grating) mendispersi cahaya → cermin fokus → celah keluar (lebar celah 0,2–2 nm menentukan lebar pita spektral yang diloloskan).","Menjamin hanya garis resonansi unsur yang sampai ke detektor; bersama modulasi lampu, emisi nyala yang tidak termodulasi tidak ikut terukur.","Drift panjang gelombang, slit salah, grating terkontaminasi.",[0.9,1.75,1]],
detector:["Detektor (PMT)","Detektor (PMT) berfungsi untuk mengubah intensitas cahaya (I₀ dan I) menjadi sinyal listrik yang sebanding dengan intensitasnya.","Foton membebaskan elektron di fotokatoda (efek fotoelektrik); elektron dipercepat ke deretan dinoda dan digandakan melalui emisi sekunder hingga menjadi arus yang terukur di anoda.","Perbandingan intensitas tanpa dan dengan atom di flame (I₀/I) menjadi dasar perhitungan absorbansi.","Tegangan PMT terlalu tinggi → noise; PMT lelah; kebocoran cahaya.",[1.3,1.8,0.2]],
panel:["Display / Control Panel","Panel kontrol/PC berfungsi untuk mengatur parameter pengukuran, mengolah sinyal detektor menjadi absorbansi dan konsentrasi, serta menampilkan hasil. Klik monitor untuk membuka kurva kalibrasi.","Sinyal diolah menjadi A = log(I₀/I) lalu dibandingkan dengan kurva kalibrasi (A terhadap konsentrasi deret standar) untuk memperoleh konsentrasi sampel.","Mengubah sinyal menjadi absorbansi dan konsentrasi.","Kurva kalibrasi non-linear, baseline drift, gangguan komunikasi PC.",[3.7,1.8,0.8]],
tray:["Posisi Larutan Sampel (Sample Tray)","Posisi larutan sampel berfungsi untuk menyediakan larutan sampel atau standar yang akan dihisap kapiler ke nebulizer (opsional: autosampler ASC-7000).","Ujung kapiler dicelupkan ke larutan; larutan dihisap kontinu ke nebulizer oleh efek Venturi.","Titik awal alur sampel; konsentrasi larutan menentukan sinyal.","Kapiler tidak tercelup, gelembung udara, kontaminasi silang antar sampel.",[-0.38,0.55,2.4]],
exhaust:["Exhaust System","Exhaust berfungsi untuk membuang gas pembakaran, panas, dan uap logam dari ruang atomisasi ke luar ruangan.","Gas panas naik ke hood; fan eksternal menghisapnya melalui duct ke luar ruangan.","Menjaga keselamatan analis dan kestabilan nyala.","Hisapan lemah → nyala goyah, gas terakumulasi; duct bocor/korosi.",[-0.4,5.1,0.3]],
burnerAdj:["Burner Adjustment","Burner adjustment berfungsi untuk mengatur tinggi, posisi lateral, dan sudut burner agar berkas lampu melewati zona atom terpekat dan tidak mengenai kepala burner.","Sambil larutan standar disemprotkan, putar knob hingga absorbansi maksimum (berkas tepat melewati zona atom bebas paling padat).","Menentukan sensitivitas dan kestabilan pengukuran.","Tidak dioptimasi → sensitivitas rendah; burner terlalu rendah → berkas terhalang kepala burner.",[-0.7,1.15,1.35]],
interlock:["Safety Interlock","Safety interlock berfungsi untuk mencegah nyala hidup, atau mematikannya otomatis, bila kondisi tidak aman.","Sensor pintu, tekanan gas, level drain, dan flame sensor memutus gas otomatis; sensor getaran (standar AA-7000) juga memadamkan nyala otomatis saat ada guncangan.","Pintu harus tertutup selama nyala menyala.","Pintu tidak tertutup penuh → api tak menyala; bypass interlock berbahaya.",[0.28,1.65,1.5]],
cover:["Penutup Atas (Top Cover)","Penutup atas berfungsi untuk melindungi kompartemen lampu dan optik dari debu serta paparan tegangan tinggi/UV, sekaligus menjadi akses perawatan.","Penutup dilepas hanya saat lampu HCL dan nyala mati (klik penutup atau tombol Lepas Penutup Atas), lalu dipasang kembali dengan rapat.","Memberi akses perawatan ke bagian dalam (optik, cermin, lampu) tanpa membongkar instrumen.","Penutup tidak terpasang rapat → debu masuk ke optik; dibuka saat lampu menyala → tegangan tinggi dan UV berbahaya.",[-0.38,3.4,1.7]],
exhaustSw:["Saklar Exhaust","Saklar exhaust berfungsi untuk menyalakan dan mematikan sistem exhaust (hijau = ON, merah = OFF). Klik saklar untuk mengubah status.","Saklar memberi daya ke fan exhaust eksternal; saat ON fan menghisap gas panas dari hood lewat duct fleksibel ke luar ruangan.","Exhaust harus ON sebelum nyala dinyalakan; bila dimatikan saat simulasi, nyala ikut dihentikan.","Fan tidak menyala → panas dan uap logam menumpuk, nyala goyah; duct tersumbat atau bocor.",[-3.4,2.6,-3.3]],

    const clip=(q,sg)=>{const o=[];for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length],ia=a.x*sg>=0,ib=b.x*sg>=0;if(ia)o.push(a);if(ia!==ib){const t=a.x/(a.x-b.x);o.push(new THREE.Vector2(0,a.y+(b.y-a.y)*t));}}return o;};
    THREE.ShapeUtils.triangulateShape(C2,[H2]).forEach(t=>{const q=[V[t[0]],V[t[1]],V[t[2]]];[1,-1].forEach(sg=>{const c=clip(q,sg);for(let i=1;i<c.length-1;i++)tr(F([c[0].x,c[0].y]),F([c[i].x,c[i].y]),F([c[i+1].x,c[i+1].y]));});});
  }else{

  for(let i=m+1;i<n;i++)tr(F(P[m]),F(P[i]),F(P[(i+1)%n]));}
  for(let i=1;i<n-1;i++)tr(K(P[0]),K(P[i+1]),K(P[i]));

/* ===== KURVA KALIBRASI (klik monitor) ===== */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GN={d:'Cu terlarut',t:'Cu total'},GC={d:'#f59e0b',t:'#f472b6'};
const DEF=()=>({el:'Cu',wl:'324.7',unit:'mg/L',zero:false,As:.215,df:1,std:[[0,0],[1,.105],[2,.208],[3,.31],[4,.415],[5,.52]],
  g:{d:{r:[.215,.221],sp:.320,add:1,fp:1,vf:50,vs:50},t:{r:[.268,.262],sp:.372,add:1,fp:1,vf:50,vs:50}}});
let cal=DEF();
const sync=()=>{const g=cal.g.d,v=g.r.filter(x=>isFinite(x));cal.As=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;cal.df=(g.fp*g.vf/g.vs)||1;};   // sinkron dgn simulasi (sampel Cu terlarut)
// Regresi linear y = m·x + b (kuadrat terkecil): slope, intercept, r, R²
function fit(){const P=cal.std.filter(q=>isFinite(q[0])&&isFinite(q[1])),n=P.length;if(n<2)return null;
  let sx=0,sy=0,sxx=0,sxy=0;P.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;});let m,b;
  if(cal.zero){if(!sxx)return null;m=sxy/sxx;b=0;}else{const d=n*sxx-sx*sx;if(!d)return null;m=(n*sxy-sx*sy)/d;b=(sy-m*sx)/n;}
  const my=sy/n;let st=0,sr=0;P.forEach(([x,y])=>{st+=(y-my)**2;sr+=(y-(m*x+b))**2;});const r2=st?1-sr/st:1;return{m,b,r2,r:(m<0?-1:1)*Math.sqrt(Math.max(0,r2)),P};}
function res(){sync();const f=fit();if(!f||!f.m)return null;const cm=(cal.As-f.b)/f.m;return{f,cm,c:cm*cal.df};}
const eq=f=>'y = '+f.b.toFixed(4)+(f.m<0?' − ':' + ')+Math.abs(f.m).toFixed(4)+'x';   // y = a + bx (a = intercept, b = slope)
function resText(){const r=res();return r?'A = '+cal.As.toFixed(3)+' → C = <b>'+r.c.toFixed(2)+' '+esc(cal.unit)+'</b> ('+esc(cal.el)+' '+esc(cal.wl)+' nm; '+eq(r.f)+'). Klik monitor untuk mengubah kurva.':'Data kalibrasi belum valid (klik monitor).';}
// Perhitungan satu kelompok sampel: C = (A−b)/m ; Kadar = C × FP × Vakhir/Vsampel ; %RPD duplikat ; %Recovery spike
function calcG(f,g){const fac=(g.fp*g.vf/g.vs)||1,c=a=>(a-f.b)/f.m,o={fac,cs:c(g.sp)};
  o.rows=g.r.map(a=>({a,c:c(a),k:c(a)*fac}));const K=o.rows.filter(q=>isFinite(q.a)&&isFinite(q.k)).map(q=>q.k),n=K.length;
  o.n=n;o.ksp=o.cs*fac;o.km=n?K.reduce((a,b)=>a+b,0)/n:NaN;o.kmax=n?Math.max(...K):NaN;o.kmin=n?Math.min(...K):NaN;
  o.sd=n>1?Math.sqrt(K.reduce((a,b)=>a+(b-o.km)**2,0)/(n-1)):NaN;
  o.rpd=n>1&&o.km?(o.kmax-o.kmin)/o.km*100:NaN;o.rsd=n>2&&o.km?o.sd/o.km*100:NaN;
  o.rec=g.add?(o.ksp-o.km)/g.add*100:NaN;return o;}
function draw(){const cv=$('cv'),g=cv.getContext('2d'),W=480,Hh=300,L=50,R=14,T=14,Bm=38;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,Hh);
  const f=fit(),P=cal.std.filter(q=>isFinite(q[0])&&isFinite(q[1])),S=[];
  if(f&&f.m)Object.keys(cal.g).forEach(k=>[...cal.g[k].r.map(()=>'r'),'sp'].forEach((j,ix)=>{const a=j==='sp'?cal.g[k].sp:cal.g[k].r[ix];if(isFinite(a))S.push({k,j,a,x:Math.max(0,(a-f.b)/f.m)});}));
  const xm=Math.max(1e-9,...P.map(q=>q[0]),...S.map(q=>q.x))*1.1,ym=Math.max(1e-9,...P.map(q=>q[1]),...S.map(q=>q.a))*1.1;
  const X=x=>L+x/xm*(W-L-R),Y=y=>Hh-Bm-y/ym*(Hh-Bm-T);
  g.strokeStyle='#1d4a58';g.fillStyle='#7f9aa8';g.font='11px system-ui';g.lineWidth=1;
  for(let i=0;i<=5;i++){const x=xm*i/5,y=ym*i/5;g.beginPath();g.moveTo(X(x),T);g.lineTo(X(x),Hh-Bm);g.moveTo(L,Y(y));g.lineTo(W-R,Y(y));g.stroke();g.fillText(x.toFixed(1),X(x)-8,Hh-Bm+14);g.fillText(y.toFixed(2),8,Y(y)+4);}
  g.fillStyle='#d6e6ee';g.fillText('Konsentrasi ('+cal.unit+')',W/2-45,Hh-6);g.save();g.translate(12,Hh/2+25);g.rotate(-Math.PI/2);g.fillText('Absorbansi',0,0);g.restore();
  if(f&&f.m){g.strokeStyle='#2dd4bf';g.lineWidth=2;g.beginPath();g.moveTo(X(0),Y(f.b));g.lineTo(X(xm),Y(f.m*xm+f.b));g.stroke();}
  g.fillStyle='#e6f6f4';P.forEach(q=>{g.beginPath();g.arc(X(q[0]),Y(q[1]),4,0,7);g.fill();});
  S.forEach(q=>{g.strokeStyle=g.fillStyle=GC[q.k];g.lineWidth=2;g.beginPath();g.arc(X(q.x),Y(q.a),5,0,7);q.j==='sp'?g.stroke():g.fill();});
  g.font='10px system-ui';[['d','● '+GN.d],['t','● '+GN.t]].forEach(([k,t],i)=>{g.fillStyle=GC[k];g.fillText(t,W-110,T+12+i*13);});g.fillStyle='#d6e6ee';g.fillText('○ = sampel + spike',W-110,T+38);}
const nf=(x,d)=>isFinite(x)?x.toFixed(d):'–',stt=(ok,t)=>'<span class="'+(ok?'ok':'bad')+'">'+(ok?'✔ ':'⚠ ')+t+'</span>';
function upd(){const f=fit();draw();let h='<p>Isi minimal 2 standar yang valid.</p>';
  if(f&&f.m){const u=esc(cal.unit),w=[];if(f.r2<.995)w.push('R² &lt; 0,995: kurva kurang linear.');
    h='<h4>1 · Regresi deret standar</h4><div class="st"><div><small>Intercept (a)</small><b>'+nf(f.b,5)+'</b></div><div><small>Slope (b)</small><b>'+nf(f.m,5)+'</b></div><div><small>r</small><b>'+nf(f.r,5)+'</b></div><div><small>R²</small><b>'+nf(f.r2,5)+'</b></div></div><p>Persamaan regresi y = a + bx: <b>'+eq(f)+'</b> (n = '+f.P.length+')</p>';
    const G={};Object.keys(cal.g).forEach(k=>G[k]=calcG(f,cal.g[k]));
    h+='<h4>2 · Perhitungan sampel sampai kadar</h4><p class="fm">C = (A − a) / b &nbsp;·&nbsp; Kadar = C × FP × V akhir / V sampel</p>';
    Object.keys(G).forEach(k=>{const o=G[k],g=cal.g[k],rw=o.rows;
      h+='<h4 style="color:'+GC[k]+'">'+GN[k]+' ('+rw.length+' pengulangan)</h4><table class="rt"><tr><th></th>'+rw.map((q,i)=>'<th>Ulangan '+(i+1)+'</th>').join('')+'<th>Sampel + spike</th></tr>'
      +'<tr><td>Absorbansi (A)</td>'+rw.map(q=>'<td>'+nf(q.a,4)+'</td>').join('')+'<td>'+nf(g.sp,4)+'</td></tr>'
      +'<tr><td>C = (A − a)/b ('+u+')</td>'+rw.map(q=>'<td>'+nf(q.c,4)+'</td>').join('')+'<td>'+nf(o.cs,4)+'</td></tr>'
      +'<tr><td>Kadar = C × '+nf(o.fac,3)+' ('+u+')</td>'+rw.map(q=>'<td>'+nf(q.k,4)+'</td>').join('')+'<td>'+nf(o.ksp,4)+'</td></tr></table>'
      +'<p class="fm">Faktor = FP × V akhir / V sampel = '+g.fp+' × '+g.vf+' / '+g.vs+' = '+nf(o.fac,3)+'</p>'
      +'<p>Kadar rata-rata = (R₁ + … + R<sub>n</sub>) / n, n = '+o.n+' → <b>'+nf(o.km,4)+' '+u+'</b></p>'
      +'<p>%RPD = (R<sub>maks</sub> − R<sub>min</sub>) / rata-rata × 100 = ('+nf(o.kmax,4)+' − '+nf(o.kmin,4)+') / '+nf(o.km,4)+' × 100 = <b>'+nf(o.rpd,2)+' %</b> '+(o.n>1?stt(o.rpd<=20,'syarat ≤ 20 %'):'<span class="bad">⚠ butuh ≥ 2 pengulangan</span>')+'</p>'
      +(o.n>2?'<p>SD = '+nf(o.sd,4)+' · %RSD = SD / rata-rata × 100 = <b>'+nf(o.rsd,2)+' %</b></p>':'')
      +'<p>%Recovery = (K<sub>spike</sub> − K<sub>rata-rata</sub>) / K<sub>ditambahkan</sub> × 100 = ('+nf(o.ksp,4)+' − '+nf(o.km,4)+') / '+nf(g.add,4)+' × 100 = <b>'+nf(o.rec,2)+' %</b> '+stt(o.rec>=80&&o.rec<=120,'syarat 80–120 %')+'</p>';});
    const d=G.d,t=G.t;h+='<h4>3 · Ringkasan kadar '+esc(cal.el)+'</h4><table class="rt"><tr><th>Kadar rata-rata</th><th>'+u+'</th></tr><tr><td>'+GN.d+'</td><td>'+nf(d.km,4)+'</td></tr><tr><td>'+GN.t+'</td><td>'+nf(t.km,4)+'</td></tr>'
      +'<tr><td>'+esc(cal.el)+' partikulat = total − terlarut</td><td>'+nf(t.km-d.km,4)+'</td></tr><tr><td>% terlarut = terlarut / total × 100</td><td>'+nf(d.km/t.km*100,2)+' %</td></tr></table>'+w.map(x=>'<p class="bad">⚠ '+x+'</p>').join('');}
  $('cr').innerHTML=h;}
function renderCal(){const gin=k=>cal.g[k].r.map((v,i)=>'<label>A pengulangan '+(i+1)+'<span><input type="number" step="any" data-g="'+k+'" data-ri="'+i+'" value="'+(isNaN(v)?'':v)+'"> <button data-rd="'+k+'" data-ri="'+i+'" title="Hapus pengulangan">×</button></span></label>').join('')+'<p><button data-ra="'+k+'">+ Pengulangan</button></p>'
  +[['sp','A sampel + spike'],['add','Spike ditambahkan ('+esc(cal.unit)+')'],['fp','Faktor pengenceran (FP)'],['vf','V akhir (mL)'],['vs','V sampel (mL)']].map(([j,l])=>'<label>'+l+'<input type="number" step="any" data-g="'+k+'" data-k="'+j+'"></label>').join('');
  $('cal').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;color:var(--teal);font-size:16px">Kurva Kalibrasi &amp; Perhitungan Kadar</h2><button id="cX">✕ Tutup</button></div>
<div class="cg"><div><h4>Parameter</h4><label>Unsur<input id="ce"></label><label>λ (nm)<input id="cw"></label><label>Satuan<input id="cu"></label>
<label class="ck"><input id="cz" type="checkbox"> Regresi melalui titik nol</label>
<h4>Deret standar (konsentrasi · absorbansi)</h4><table id="ct"></table><p><button id="cAdd">+ Standar</button> <button id="cRst">Reset</button></p>
<h4 style="color:${GC.d}">Sampel ${GN.d}</h4>${gin('d')}<h4 style="color:${GC.t}">Sampel ${GN.t}</h4>${gin('t')}
<p><button id="cRun">▶ Simulasikan dengan data ini</button></p></div>
<div><canvas id="cv" width="960" height="600" style="width:100%;max-width:560px"></canvas><div id="cr"></div></div></div>`;
  $('ce').value=cal.el;$('cw').value=cal.wl;$('cu').value=cal.unit;$('cz').checked=cal.zero;
  $('cal').querySelectorAll('[data-g][data-k]').forEach(el=>el.value=isNaN(cal.g[el.dataset.g][el.dataset.k])?'':cal.g[el.dataset.g][el.dataset.k]);
  $('ct').innerHTML=cal.std.map((q,i)=>'<tr><td>'+(i+1)+'</td>'+[0,1].map(j=>'<td><input type="number" step="any" data-i="'+i+'" data-j="'+j+'" value="'+(isNaN(q[j])?'':q[j])+'"></td>').join('')+'<td><button data-d="'+i+'">×</button></td></tr>').join('');
  upd();}
function openCal(){$('cal').classList.add('show');renderCal();}
$('cal').addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.i!==undefined)cal.std[+d.i][+d.j]=parseFloat(t.value);else if(d.ri!==undefined)cal.g[d.g].r[+d.ri]=parseFloat(t.value);else if(d.g)cal.g[d.g][d.k]=parseFloat(t.value);
  else{const m={ce:()=>cal.el=t.value,cw:()=>cal.wl=t.value,cu:()=>cal.unit=t.value,cz:()=>cal.zero=t.checked};if(m[t.id])m[t.id]();}upd();});
$('cal').addEventListener('click',e=>{const t=e.target,d=t.dataset;
  if(t.id==='cX')$('cal').classList.remove('show');
  else if(t.id==='cAdd'){cal.std.push([NaN,NaN]);renderCal();}
  else if(t.id==='cRst'){cal=DEF();renderCal();}
  else if(t.id==='cRun'){$('cal').classList.remove('show');startSim();}
  else if(d.ra!==undefined){cal.g[d.ra].r.push(NaN);renderCal();}
  else if(d.rd!==undefined){const r=cal.g[d.rd].r;if(r.length>1){r.splice(+d.ri,1);renderCal();}}
  else if(d.d!==undefined){cal.std.splice(+d.d,1);renderCal();}});
$('bCal').onclick=openCal;

/* ===== LOOP ANIMASI ===== */
const clock=new THREE.Clock();
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
const v3=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  updateSim(dt);
  if(goal){camera.position.lerp(goal.p,.06);controls.target.lerp(goal.t,.06);if(camera.position.distanceTo(goal.p)<.03)goal=null;}
  controls.update();
  {coverP+=((coverOff?1:0)-coverP)*Math.min(1,dt*2.2);if(Math.abs((coverOff?1:0)-coverP)<.001)coverP=coverOff?1:0;
   const sm=(a,b,x)=>{const u=Math.max(0,Math.min(1,(x-a)/(b-a)));return u*u*(3-2*u)};
   cover.position.set(-2.6*sm(.4,1,coverP),.6*sm(0,.4,coverP),0);}
  doorL.rotation.y+=((lampDoorOpen?2.7:0)-doorL.rotation.y)*.1;
  {let d=turGoal-turret.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));turret.rotation.y+=d*.09;
   lampG.forEach((g,i)=>{g.rotation.y=-turret.rotation.y;g.position.y+=(.015+((lampOut&&i===lampIdx)?.38:0)-g.position.y)*.12;});
   lampG[lampIdx].getWorldPosition(wpv);hclGlow.position.set(wpv.x,wpv.y+.6,wpv.z);hclHalo.position.copy(hclGlow.position);}
  door.rotation.x+=((doorOpen?-1.6:0)-door.rotation.x)*.1; led.material.color.setHex(doorOpen?0xff3b3b:0x34d399);
  // nyala + cahaya
  flame.visible=flameOn;if(flameOn){if(pathMode)pathT+=dt;else pathT=0;
    const fT=sim?(sim.step>=3?1:0):(pathMode&&pathT>4?1:0);fMix+=(fT-fMix)*Math.min(1,dt*1.6);
    flameU.uT.value=t;flameU.uMix.value=fMix;flameLight.color.lerpColors(cB[3],cO[3],fMix);
    flame.scale.set(1,1+.28*fMix+.07*Math.sin(t*14)+.04*Math.sin(t*23)+.03*Math.sin(t*37),1);flame.rotation.x=.05*Math.sin(t*3.1)+.025*Math.sin(t*8.7);
    flameLight.intensity=(.8+.5*fMix)+.4*Math.sin(t*20)+.25*Math.sin(t*33);}else flameLight.intensity=0;
  // berkas cahaya (transmitansi T = 10^-A)
  const T=Math.pow(10,-A),L=lampOn?1:0,LB=(lampOn&&xray)?1:0;beams.forEach((b,i)=>{const o=i<3?.9:i===3?.95:.9*T;b.material.opacity=o*LB;b.userData.core.material.opacity=Math.min(1,o*LB*1.1);});
  photons.forEach((sp,i)=>{const d=((i/photons.length)+t*.2)%1*BT;let k=1;while(k<BL.length-1&&d>BL[k])k++;sp.position.lerpVectors(BP[k-1],BP[k],(d-BL[k-1])/(BL[k]-BL[k-1]));sp.material.opacity=LB*(k>=5?Math.max(.35,T):1);});
  hclGlow.material.opacity=L*(.75+.15*Math.sin(t*10));hclHalo.material.opacity=L*(.28+.06*Math.sin(t*10));lampWin.material.color.lerpColors(wOff,wOn,L*(.8+.15*Math.sin(t*10)));lampLight.intensity=L*(1.6+.3*Math.sin(t*10));
  pts.visible=flowOn;if(flowOn)updateParticles(dt,limit);
  // highlight komponen
  const k=.3+.22*Math.sin(t*4);pick.forEach(m=>{const mm=m.material;if(!mm.emissive)return;const id=m.userData.id;
    mm.emissive.setHex(0x14b8a6);mm.emissiveIntensity=id===selected?k+.25:hl.has(id)?k:id===hover?.18:0;});
  // posisi label
  const W=view.clientWidth,Hh=view.clientHeight;
  for(const id in labels){const l=labels[id];if(!labelsOn){l.style.display='none';continue;}v3.set(...D[id][5]).project(camera);
    if(v3.z>1){l.style.display='none';continue;}l.style.display='block';l.style.left=(v3.x*.5+.5)*W+'px';l.style.top=(-v3.y*.5+.5)*Hh+'px';}
  renderer.render(scene,camera);}
if(!isMob())stage.classList.add('menu');
['pipe','btns'].forEach(id=>{const el=$(id);let dx=null,sl=0,moved=false;
  el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dx=e.clientX;sl=el.scrollLeft;moved=false;}});
  window.addEventListener('pointermove',e=>{if(dx!==null){const d=e.clientX-dx;if(Math.abs(d)>5)moved=true;el.scrollLeft=sl-d;}});
  window.addEventListener('pointerup',()=>{dx=null;});
  el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);});
$('mBtn').onclick=()=>stage.classList.toggle('menu');
$('iBtn').onclick=()=>stage.classList.toggle(isMob()?'info':'noinfo');
$('iX').onclick=()=>stage.classList.remove('info');
welcome();setMode('overview');loop();
})();
